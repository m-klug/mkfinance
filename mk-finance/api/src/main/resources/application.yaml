spring:
  application:
    name: mk-finance-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mkfinance}
    username: ${POSTGRES_USER:mkfinance}
    password: ${POSTGRES_PASSWORD:mkfinance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  # Behind Caddy (TLS terminated at the edge, proxied to the app over HTTP), honour the
  # X-Forwarded-* headers so the app sees the real https scheme + external host. Without this a
  # same-origin browser POST looks cross-origin to the app (http/:8080 vs the https Origin), and
  # Spring's CORS filter rejects it with 403 before the controller.
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        name: MK_FINANCE_SESSION
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Allowed browser origins. Defaults to the Vite dev origin; override in production with the real
# site origin(s) via MKFINANCE_CORS_ALLOWED_ORIGINS (comma-separated). With forward-headers-strategy
# above, a same-origin request is no longer seen as CORS, so this mainly guards genuine cross-origin.
mkfinance:
  cors:
    allowed-origins: ${MKFINANCE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
