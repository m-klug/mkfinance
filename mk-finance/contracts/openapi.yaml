openapi: 3.0.3
info:
  title: MK Finance API
  description: >
    Personal finance API (MVP). Money values are always integer cents (int64).
    Business dates are ISO local dates in America/Sao_Paulo. Errors return a
    machine-readable code translated by the client. See PLANEJAMENTO.md for
    the business rules referenced here (R1..R10).
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: auth
  - name: workspaces
  - name: accounts
  - name: categories
  - name: pillars
  - name: transactions
  - name: transfers
  - name: cards
  - name: statements
  - name: dashboard
  - name: recurrences
  - name: calendar
  - name: tags
  - name: export

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created; personal workspace seeded; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Session invalidated. }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user with workspace memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces the current user is a member of.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceRequest' }
      responses:
        '201':
          description: Workspace created with defaults seeded; caller becomes OWNER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  /workspaces/{workspaceId}/invites:
    post:
      tags: [workspaces]
      operationId: createInvite
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '201':
          description: Single-use invite token (share as link).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }

  /invites/{token}/accept:
    post:
      tags: [workspaces]
      operationId: acceptInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current user joined the workspace as MEMBER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '410': { $ref: '#/components/responses/Gone' }

  /workspaces/{workspaceId}/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts with their current and projected balances (R5).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [accounts]
      operationId: createAccount
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /workspaces/{workspaceId}/accounts/{accountId}:
    patch:
      tags: [accounts]
      operationId: updateAccount
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      description: Fails with ACCOUNT_HAS_TRANSACTIONS if any transaction references it (archive instead).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/accounts/{accountId}/archive:
    post:
      tags: [accounts]
      operationId: archiveAccount
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '200':
          description: Archived (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /workspaces/{workspaceId}/categories:
    get:
      tags: [categories]
      operationId: listCategories
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
      responses:
        '200':
          description: Flat list; client builds the tree via parentId, grouped by pillar.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [categories]
      operationId: createCategory
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Created. EXPENSE requires pillar; INCOME forbids it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /workspaces/{workspaceId}/categories/{categoryId}:
    patch:
      tags: [categories]
      operationId: updateCategory
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/categoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      description: Fails with CATEGORY_IN_USE if referenced; archive semantics handled client-side by hiding.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/categoryId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/pillar-allocations:
    get:
      tags: [pillars]
      operationId: listPillarAllocations
      description: >
        Targets in force during the given month. Targets are versioned by competency: editing them
        applies from the current month onwards and never rewrites a closed month, so a past report
        keeps the targets it was judged against.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Target percent per pillar for that month; always the six pillars, summing 100.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PillarAllocation' }
    put:
      tags: [pillars]
      operationId: updatePillarAllocations
      description: >
        Replaces the targets from the current month onwards (effectiveFrom = first day of the
        current month in America/Sao_Paulo). Earlier competencies are left untouched. PUT rather
        than PATCH because the six targets are one indivisible set — they only mean anything if
        they add up to 100.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PillarAllocationsRequest' }
      responses:
        '200':
          description: The targets now in force.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PillarAllocation' }
        '400':
          description: PILLAR_TARGETS_MUST_SUM_100 when the six targets do not add up to 100.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TransactionType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransactionStatus' } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tagsFilter' }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: Paginated transactions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
    post:
      tags: [transactions]
      operationId: createTransaction
      description: INCOME or EXPENSE only — transfers/contributions go through /transfers.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

  /workspaces/{workspaceId}/transactions/{transactionId}:
    patch:
      tags: [transactions]
      operationId: updateTransaction
      description: >
        Edits an INCOME or EXPENSE entry. Transfer legs are not editable here — a transfer has no
        category and its type cannot change, so it has its own payload at
        PATCH /transfers/{transactionId}; sending a transfer leg's id to this endpoint answers
        TRANSACTION_TYPE_IMMUTABLE.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      description: >
        Deleting one leg of a transfer deletes its pair atomically. The debit created by a
        credit-card statement payment cannot be deleted here — it answers 409
        TRANSACTION_LOCKED_BY_PAYMENT, and the client should send the user to reverse the
        payment on the statement, which removes both.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/transactions/{transactionId}/settle:
    post:
      tags: [transactions]
      operationId: settleTransaction
      description: One-click settle of a PENDING transaction (R5).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '200':
          description: Now SETTLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/transfers:
    post:
      tags: [transfers]
      operationId: createTransfer
      description: >
        Creates the mirrored pair (R4). When the destination account type is INVESTMENT or
        SAVINGS this is a contribution: contributionPillar applies (defaults to the account's
        defaultContributionPillar, R9) and the amount counts toward that pillar's allocation
        without being an expense.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: Both legs created; returns the outgoing leg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

  /workspaces/{workspaceId}/transfers/{transactionId}:
    patch:
      tags: [transfers]
      operationId: updateTransfer
      description: >
        Edits a transfer through either of its legs, updating the mirrored pair atomically (R4).
        Shared facts (amountCents, date, description, note, status) are written to both legs;
        accountId moves only the leg addressed by transactionId, since each side lives on its own
        account. Moving the incoming leg to a non-INVESTMENT/SAVINGS account drops the contribution
        pillar instead of failing (R9). Transfers have their own payload because they carry no
        category and their type cannot change, which TransactionRequest requires.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferUpdateRequest' }
      responses:
        '200':
          description: Both legs updated; returns the leg addressed by transactionId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/cards:
    get:
      tags: [cards]
      operationId: listCards
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Cards with available limit (limit − unpaid statements).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
    post:
      tags: [cards]
      operationId: createCard
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /workspaces/{workspaceId}/cards/{cardId}:
    patch:
      tags: [cards]
      operationId: updateCard
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '200':
          description: Updated. Changing closingDay/dueDay only affects OPEN/future statements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /workspaces/{workspaceId}/cards/{cardId}/archive:
    post:
      tags: [cards]
      operationId: archiveCard
      description: >
        Archives the card (idempotent). An archived card is read-only history: it stays visible
        with includeArchived=true and its statements can still be read and paid, but no new
        purchase may be charged to it (CARD_ARCHIVED).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      responses:
        '200':
          description: Archived (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/cards/{cardId}/purchases:
    post:
      tags: [cards]
      operationId: createCardPurchase
      description: >
        Creates the purchase and all installments up-front, allocated to consecutive
        statements starting from the one determined by purchaseDate vs closingDay (R1, R3).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPurchaseRequest' }
      responses:
        '201':
          description: Purchase with generated installments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPurchase' }

  /workspaces/{workspaceId}/purchases/{purchaseId}:
    patch:
      tags: [cards]
      operationId: updateCardPurchase
      description: Affects only installments on non-PAID statements (R6); otherwise STATEMENT_IMMUTABLE.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/purchaseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPurchaseRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPurchase' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [cards]
      operationId: deleteCardPurchase
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/purchaseId' }
      responses:
        '204': { description: Deleted (only if no installment sits on a PAID statement). }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/cards/{cardId}/statements:
    get:
      tags: [statements]
      operationId: listStatements
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
        - name: from
          in: query
          description: Reference month (YYYY-MM), inclusive.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: to
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Statements in the window (created lazily as needed).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }

  /workspaces/{workspaceId}/statements/{statementId}:
    get:
      tags: [statements]
      operationId: getStatement
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
      responses:
        '200':
          description: Statement with line items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementDetail' }

  /workspaces/{workspaceId}/statements/{statementId}/payments:
    post:
      tags: [statements]
      operationId: payStatement
      description: >
        Full or partial payment. Debits the chosen account by creating an EXPENSE
        transaction with the system category "statement payment" (excluded from category
        reports, R2). Partial payment sets status PARTIAL; no revolving interest (MVP).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementPaymentRequest' }
      responses:
        '201':
          description: Payment registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/statements/{statementId}/payments/{paymentId}:
    delete:
      tags: [statements]
      operationId: reverseStatementPayment
      description: >
        Reverses one payment, deleting the EXPENSE transaction it created on the account
        along with it. Allowed on a PAID statement — R6 freezes a settled bill against
        charges, not against undoing the payment that settled it. The status is derived
        from the payments that remain, so it returns to PARTIAL or OPEN by itself and the
        statement total is unaffected. Deleting that EXPENSE directly through
        /transactions is refused with TRANSACTION_LOCKED_BY_PAYMENT; this is the way out.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Payment reversed. }
        '404':
          description: >
            STATEMENT_PAYMENT_NOT_FOUND when no such payment exists on this statement —
            including a payment id that belongs to a different statement — or
            STATEMENT_NOT_FOUND when the statement is not in this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Balances, month income/expense, category breakdown, open statements, previous-month comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /workspaces/{workspaceId}/dashboard/pillar-allocation:
    get:
      tags: [dashboard]
      operationId: getPillarAllocation
      description: 'Percent of month income consumed per pillar vs target (R2, R9, R10): expenses by competency + contributions, divided by month income.'
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Allocation report; noIncome=true means percents are null and absolute values should be shown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PillarAllocationReport' }

  /workspaces/{workspaceId}/recurrences:
    get:
      tags: [recurrences]
      operationId: listRecurrences
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: active
          in: query
          description: Omit to list every rule, including the ones closed by a THIS_AND_FUTURE edit.
          schema: { type: boolean }
      responses:
        '200':
          description: Recurrence rules of the workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recurrence' }
    post:
      tags: [recurrences]
      operationId: createRecurrence
      description: >
        Creates the rule only. Occurrences are materialized lazily as PENDING transactions when a
        month is read (extrato or calendar), the same way statements are created on demand — so a
        rule with no end date does not write rows into the year 2094.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurrenceRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurrence' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workspaces/{workspaceId}/recurrences/{recurrenceId}:
    patch:
      tags: [recurrences]
      operationId: updateRecurrence
      description: >
        Edits the series with calendar semantics, chosen by scope.
        THIS_ONE touches only the occurrence at occurrenceDate — the rule is left alone and the
        change lands on the transaction that occurrence materialized into; scheduling fields
        (frequency, dayOfMonth, dayOfWeek, monthOfYear, startDate, endDate) are ignored, since one
        occurrence has no schedule of its own.
        THIS_AND_FUTURE closes the current rule (endDate = the day before occurrenceDate) and
        creates a new one starting at occurrenceDate with the new values, which is what keeps the
        past intact; the response is the new rule.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/recurrenceId' }
        - { $ref: '#/components/parameters/recurrenceScope' }
        - { $ref: '#/components/parameters/occurrenceDate' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurrenceRequest' }
      responses:
        '200':
          description: The rule in force from occurrenceDate onwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurrence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: >
            RECURRENCE_NOT_FOUND, or RECURRENCE_OCCURRENCE_NOT_FOUND when occurrenceDate is not a
            date this rule actually falls on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [recurrences]
      operationId: deleteRecurrence
      description: >
        THIS_ONE marks the occurrence at occurrenceDate as SKIPPED and removes the PENDING
        transaction it had materialized; an occurrence already settled is kept, because deleting a
        rule must never erase money that was actually spent.
        THIS_AND_FUTURE closes the rule at the day before occurrenceDate and drops its
        still-PENDING occurrences from there on. Omitting occurrenceDate ends the series today,
        which is how the UI's plain "delete" behaves.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/recurrenceId' }
        - { $ref: '#/components/parameters/recurrenceScope' }
        - { $ref: '#/components/parameters/occurrenceDate' }
      responses:
        '204': { description: Occurrence skipped or series closed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      description: >
        Read-only month agenda: statement due dates and every still-pending transaction, including
        the ones a recurrence materialized (reading the month is what materializes them). There is
        no separate "recurrence occurrence" entry — a materialized occurrence *is* a pending
        transaction, and listing it twice would double the month. Entries carrying recurrenceId are
        the ones a series produced. Nothing is confirmed or paid from here; settling still goes
        through POST /transactions/{transactionId}/settle.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Entries of the month, ascending by date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarMonth' }

  /workspaces/{workspaceId}/tags:
    get:
      tags: [tags]
      operationId: listTags
      description: Every tag of the workspace, alphabetical — the source for the client-side autocomplete.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
    post:
      tags: [tags]
      operationId: createTag
      description: >
        Explicit creation, for managing tags outside a transaction. Typing a new tag while filling
        a transaction does not need this — TransactionRequest.tags creates what is missing.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tags/{tagId}:
    patch:
      tags: [tags]
      operationId: updateTag
      description: Renames the tag on every transaction carrying it. TAG_NAME_DUPLICATE if the name is taken.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/tagId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRequest' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tags]
      operationId: deleteTag
      description: >
        Deletes the tag and unlinks it from every transaction. The transactions themselves are
        never touched — a tag is a label, not the record.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/tagId' }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/export/transactions.csv:
    get:
      tags: [export]
      operationId: exportTransactionsCsv
      description: Same filters as listTransactions. UTF-8 with BOM, ';' separator (Excel pt-BR).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV stream.
          content:
            text/csv:
              schema: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: MK_FINANCE_SESSION

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    transactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    cardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    purchaseId:
      name: purchaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    statementId:
      name: statementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    recurrenceId:
      name: recurrenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    tagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    month:
      name: month
      in: query
      description: Reference month YYYY-MM; defaults to current month in America/Sao_Paulo.
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    recurrenceScope:
      name: scope
      in: query
      description: Which part of the series the edit or deletion reaches.
      schema:
        allOf: [{ $ref: '#/components/schemas/RecurrenceScope' }]
        default: THIS_AND_FUTURE
    occurrenceDate:
      name: occurrenceDate
      in: query
      description: >
        The occurrence the scope pivots on. Required for THIS_ONE (VALIDATION_ERROR without it);
        for THIS_AND_FUTURE it defaults to the next occurrence on or after today, so the change
        takes effect going forward without the client having to compute the date.
      schema: { type: string, format: date }
    tagsFilter:
      name: tags
      in: query
      description: >
        Tag names; a transaction matches when it carries ANY of them (OR), narrowed further by the
        other filters. Compared case-insensitively, like everything else about tag names.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }

  responses:
    Unauthorized:
      description: Not authenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Malformed or inconsistent payload; see error code (VALIDATION_ERROR carries fieldErrors).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Business rule violation; see error code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: Resource expired or already used.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: >
        No such resource in this workspace. Another workspace's resource is indistinguishable from
        a nonexistent one — a 404, never a leak (R8).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >
            Machine-readable code translated by the client. Kept in sync with
            domain/exception/ErrorCode.java. Known codes include:
            auth — EMAIL_ALREADY_USED, INVALID_CREDENTIALS, UNAUTHENTICATED;
            workspace — NOT_A_MEMBER, WORKSPACE_NOT_FOUND, ACCESS_DENIED, INVITE_EXPIRED;
            accounts — ACCOUNT_NOT_FOUND, ACCOUNT_HAS_TRANSACTIONS, INVALID_CONTRIBUTION_PILLAR;
            categories — CATEGORY_NOT_FOUND, CATEGORY_IN_USE, CATEGORY_PILLAR_REQUIRED,
            CATEGORY_PILLAR_FORBIDDEN, SYSTEM_CATEGORY_READONLY;
            transactions and transfers — TRANSACTION_NOT_FOUND, TRANSACTION_ALREADY_SETTLED,
            TRANSACTION_TYPE_IMMUTABLE, CATEGORY_TYPE_MISMATCH, INSUFFICIENT_TRANSFER_ACCOUNTS,
            CONTRIBUTION_PILLAR_REQUIRED, TRANSACTION_LOCKED_BY_PAYMENT;
            cards and statements — CARD_NOT_FOUND, CARD_ARCHIVED, PURCHASE_NOT_FOUND,
            STATEMENT_NOT_FOUND, STATEMENT_PAYMENT_NOT_FOUND, STATEMENT_IMMUTABLE,
            STATEMENT_ALREADY_PAID, PAYMENT_EXCEEDS_REMAINING, STATEMENT_EMPTY;
            pillar targets — PILLAR_TARGETS_MUST_SUM_100;
            recurrences — RECURRENCE_NOT_FOUND, RECURRENCE_OCCURRENCE_NOT_FOUND;
            tags — TAG_NAME_DUPLICATE;
            generic — VALIDATION_ERROR, DATA_INTEGRITY_VIOLATION, INTERNAL_ERROR.
        params:
          type: object
          additionalProperties: true
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }

    Pillar:
      type: string
      enum: [FIXED_COSTS, COMFORT, GOALS, PLEASURES, FINANCIAL_FREEDOM, KNOWLEDGE]
    ContributionPillar:
      type: string
      enum: [GOALS, FINANCIAL_FREEDOM]
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, INVESTMENT, OTHER]
    CategoryType:
      type: string
      enum: [INCOME, EXPENSE]
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER]
    TransactionStatus:
      type: string
      enum: [SETTLED, PENDING]
    TransferDirection:
      type: string
      enum: [OUT, IN]
    StatementStatus:
      type: string
      enum: [OPEN, CLOSED, PAID, PARTIAL]
    MemberRole:
      type: string
      enum: [OWNER, MEMBER]
    RecurrenceFrequency:
      type: string
      description: >
        MONTHLY is the case that matters (salary, rent, subscriptions); WEEKLY and YEARLY round it
        out. Deliberately not a cron expression — nothing in a personal budget needs one.
      enum: [MONTHLY, WEEKLY, YEARLY]
    RecurrenceScope:
      type: string
      enum: [THIS_ONE, THIS_AND_FUTURE]
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    CalendarEntryKind:
      type: string
      enum: [STATEMENT_DUE, PENDING_TRANSACTION]

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    CurrentUser:
      type: object
      required: [id, name, email, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        locale: { type: string, example: pt-BR }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }

    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }

    WorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }

    Invite:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    Account:
      type: object
      required: [id, name, type, initialBalanceCents, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        initialBalanceCents: { type: integer, format: int64 }
        balanceCents:
          type: integer
          format: int64
          nullable: true
          description: initial + settled transactions (R5).
        projectedBalanceCents:
          type: integer
          format: int64
          nullable: true
          description: balance + settled and pending transactions (R5).
        defaultContributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
        color: { type: string, nullable: true, example: '#16A34A' }
        icon: { type: string, nullable: true }
        archived: { type: boolean }

    AccountRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/AccountType' }
        initialBalanceCents: { type: integer, format: int64, default: 0 }
        defaultContributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }

    Category:
      type: object
      required: [id, name, type, system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/CategoryType' }
        pillar:
          allOf: [{ $ref: '#/components/schemas/Pillar' }]
          nullable: true
          description: Required for EXPENSE, null for INCOME.
        parentId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        system:
          type: boolean
          description: System categories (e.g. statement payment) cannot be edited/deleted and are excluded from category reports (R2).

    CategoryRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 80 }
        type: { $ref: '#/components/schemas/CategoryType' }
        pillar:
          allOf: [{ $ref: '#/components/schemas/Pillar' }]
          nullable: true
        parentId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }

    PillarAllocation:
      type: object
      required: [pillar, targetPercent]
      properties:
        pillar: { $ref: '#/components/schemas/Pillar' }
        targetPercent: { type: integer, minimum: 0, maximum: 100 }
        effectiveFrom:
          type: string
          format: date
          description: >
            First day of the competency this target started applying from. Lets the UI say since
            when the number has been in force; absent on requests.

    PillarAllocationsRequest:
      type: object
      required: [allocations]
      description: >
        All six pillars at once. A subset is rejected — targets are only meaningful as a whole, and
        a missing pillar is indistinguishable from one the client forgot.
      properties:
        allocations:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [pillar, targetPercent]
            properties:
              pillar: { $ref: '#/components/schemas/Pillar' }
              targetPercent: { type: integer, minimum: 0, maximum: 100 }

    Transaction:
      type: object
      required: [id, accountId, type, amountCents, date, description, status]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true, description: Null for transfers. }
        type: { $ref: '#/components/schemas/TransactionType' }
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string }
        note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        transferPairId: { type: string, format: uuid, nullable: true }
        transferDirection:
          allOf: [{ $ref: '#/components/schemas/TransferDirection' }]
          nullable: true
          description: >
            OUT on the source leg, IN on the destination leg; null for INCOME/EXPENSE. amountCents
            is always positive, so this is the only way to tell money leaving an account from money
            arriving in it when rendering a transfer in the extrato.
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: Set on transfer legs into INVESTMENT/SAVINGS accounts (R9).
        recurrenceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The rule that materialized this row, when it came from a recurrence. The extrato uses
            it to badge the entry and to offer editing the whole series.
        tags:
          type: array
          description: >
            Always sent by the server, empty when the transaction has none. Optional here only so
            that clients written before Phase 2 keep type-checking.
          items: { $ref: '#/components/schemas/Tag' }

    TransactionRequest:
      type: object
      required: [accountId, categoryId, type, amountCents, date, description]
      properties:
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        type:
          type: string
          enum: [INCOME, EXPENSE]
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/TransactionStatus' }]
          default: SETTLED
        tags:
          type: array
          description: >
            Tag names, not ids: a tag is its name, and typing one that does not exist yet creates
            it. Duplicates within the list are collapsed case-insensitively. Sending the field
            replaces the whole set; omitting it leaves the current tags alone.
          items: { type: string, maxLength: 40 }

    TransactionPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }

    TransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amountCents, date, description]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: Only when destination is INVESTMENT/SAVINGS; defaults to the account's default pillar.

    TransferUpdateRequest:
      type: object
      required: [amountCents, date, description]
      description: >
        Payload for PATCH /transfers/{transactionId}. It has no categoryId and no type on purpose:
        a transfer carries neither, which is exactly why TransactionRequest cannot express it.
      properties:
        accountId:
          type: string
          format: uuid
          nullable: true
          description: >
            Moves only the leg being edited to another account; omit to leave it where it is.
            Pointing it at the sibling's account answers INSUFFICIENT_TRANSFER_ACCOUNTS.
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/TransactionStatus' }]
          nullable: true
          description: Applied to both legs; omit to keep the current one. A half-settled transfer is never produced.
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: >
            Re-targets the contribution (R9). Omit to keep whichever pillar the transfer already
            carries. Only meaningful when the destination account is INVESTMENT/SAVINGS; sending it
            for any other destination answers INVALID_CONTRIBUTION_PILLAR.

    Card:
      type: object
      required: [id, name, limitCents, closingDay, dueDay, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, nullable: true }
        limitCents: { type: integer, format: int64 }
        availableLimitCents:
          type: integer
          format: int64
          nullable: true
          description: limit − sum of unpaid statements.
        closingDay: { type: integer, minimum: 1, maximum: 28 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        defaultPaymentAccountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        archived: { type: boolean }

    CardRequest:
      type: object
      required: [name, limitCents, closingDay, dueDay]
      properties:
        name: { type: string, maxLength: 120 }
        brand: { type: string, nullable: true }
        limitCents: { type: integer, format: int64, minimum: 0 }
        closingDay: { type: integer, minimum: 1, maximum: 28 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        defaultPaymentAccountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }

    CardPurchaseRequest:
      type: object
      required: [categoryId, description, totalAmountCents, purchaseDate]
      properties:
        categoryId: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        totalAmountCents: { type: integer, format: int64, minimum: 1 }
        purchaseDate: { type: string, format: date }
        installmentCount: { type: integer, minimum: 1, maximum: 60, default: 1 }

    CardPurchase:
      type: object
      required: [id, cardId, categoryId, description, totalAmountCents, purchaseDate, installmentCount, installments]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        description: { type: string }
        totalAmountCents: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        installmentCount: { type: integer }
        installments:
          type: array
          items: { $ref: '#/components/schemas/Installment' }

    Installment:
      type: object
      required: [id, number, amountCents, statementId]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: 1-based. Cent remainder goes to the last installment (R1). }
        amountCents: { type: integer, format: int64 }
        statementId: { type: string, format: uuid }
        statementMonth: { type: string, example: '2026-08' }

    Statement:
      type: object
      required: [id, cardId, referenceMonth, closingDate, dueDate, status, totalCents, paidCents]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        referenceMonth: { type: string, example: '2026-07' }
        closingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/StatementStatus' }
        totalCents: { type: integer, format: int64 }
        paidCents: { type: integer, format: int64 }

    StatementDetail:
      allOf:
        - $ref: '#/components/schemas/Statement'
        - type: object
          required: [items, payments]
          properties:
            payments:
              description: >
                Payments made against this statement, oldest first. Listed individually
                rather than only summed into paidCents because each one is separately
                reversible — the client needs the id to say which.
              type: array
              items:
                type: object
                required: [id, accountId, amountCents, paymentDate]
                properties:
                  id: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  amountCents: { type: integer, format: int64 }
                  paymentDate: { type: string, format: date }
                  transactionId:
                    type: string
                    format: uuid
                    description: The EXPENSE row this payment created in the extrato (R2).
            items:
              type: array
              items:
                type: object
                required: [installmentId, purchaseId, description, categoryId, amountCents, purchaseDate, installmentNumber, installmentCount]
                properties:
                  installmentId: { type: string, format: uuid }
                  purchaseId: { type: string, format: uuid }
                  description: { type: string }
                  categoryId: { type: string, format: uuid }
                  amountCents: { type: integer, format: int64 }
                  purchaseDate: { type: string, format: date }
                  installmentNumber: { type: integer }
                  installmentCount: { type: integer }

    StatementPaymentRequest:
      type: object
      required: [accountId, amountCents, paymentDate]
      properties:
        accountId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        paymentDate: { type: string, format: date }

    Recurrence:
      type: object
      required: [id, type, accountId, categoryId, amountCents, description, frequency, startDate, active]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [INCOME, EXPENSE]
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        description: { type: string }
        note: { type: string, nullable: true }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: >
            MONTHLY and YEARLY. A day the month does not have falls on its last day — 31 becomes
            the 28th in February — instead of skipping the month.
        dayOfWeek:
          allOf: [{ $ref: '#/components/schemas/DayOfWeek' }]
          nullable: true
          description: WEEKLY only.
        monthOfYear:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
          description: YEARLY only, paired with dayOfMonth.
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          nullable: true
          description: Inclusive; null means open-ended. Set by a THIS_AND_FUTURE edit when it closes the rule.
        active:
          type: boolean
          description: >
            A deactivated rule stops producing new occurrences but keeps the ones already
            materialized — turning off the subscription does not undo the months you paid.

    RecurrenceRequest:
      type: object
      required: [type, accountId, categoryId, amountCents, description, frequency, startDate]
      description: >
        The scheduling fields required depend on frequency — dayOfMonth for MONTHLY, dayOfWeek for
        WEEKLY, dayOfMonth + monthOfYear for YEARLY. OpenAPI cannot express that conditional, so
        the server checks it and answers VALIDATION_ERROR with the offending field.
      properties:
        type:
          type: string
          enum: [INCOME, EXPENSE]
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, nullable: true }
        dayOfWeek:
          allOf: [{ $ref: '#/components/schemas/DayOfWeek' }]
          nullable: true
        monthOfYear: { type: integer, minimum: 1, maximum: 12, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        active: { type: boolean, default: true }

    CalendarMonth:
      type: object
      required: [month, entries]
      properties:
        month: { type: string, example: '2026-08' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/CalendarEntry' }

    CalendarEntry:
      type: object
      required: [date, kind, description, amountCents]
      properties:
        date: { type: string, format: date }
        kind: { $ref: '#/components/schemas/CalendarEntryKind' }
        description:
          type: string
          description: The transaction's description, or the card's name for a statement due date.
        amountCents:
          type: integer
          format: int64
          description: >
            Always positive. What it means comes from kind and direction — the remaining balance of
            the statement for STATEMENT_DUE, the transaction amount otherwise.
        direction:
          allOf: [{ $ref: '#/components/schemas/TransferDirection' }]
          nullable: true
          description: IN for money expected, OUT for money owed; null when kind carries it already.
        transactionId: { type: string, format: uuid, nullable: true }
        statementId: { type: string, format: uuid, nullable: true }
        cardId: { type: string, format: uuid, nullable: true }
        accountId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        recurrenceId:
          type: string
          format: uuid
          nullable: true
          description: Set when this pending transaction came from a recurrence.

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          description: Unique per workspace, compared case-insensitively; stored as typed.

    DashboardSummary:
      type: object
      required: [month, totalBalanceCents, totalBalanceWithInvestmentsCents, incomeCents, expenseCents, accounts, expenseByCategory, openStatements]
      properties:
        month: { type: string, example: '2026-07' }
        totalBalanceCents: { type: integer, format: int64, description: Excludes INVESTMENT accounts. }
        totalBalanceWithInvestmentsCents: { type: integer, format: int64 }
        incomeCents: { type: integer, format: int64 }
        expenseCents: { type: integer, format: int64, description: By competency — card purchases count on purchase date (R2). }
        previousMonthIncomeCents: { type: integer, format: int64, nullable: true }
        previousMonthExpenseCents: { type: integer, format: int64, nullable: true }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        expenseByCategory:
          type: array
          items:
            type: object
            required: [categoryId, pillar, amountCents]
            properties:
              categoryId: { type: string, format: uuid }
              pillar: { $ref: '#/components/schemas/Pillar' }
              amountCents: { type: integer, format: int64 }
        openStatements:
          type: array
          items: { $ref: '#/components/schemas/Statement' }

    PillarAllocationReport:
      type: object
      required: [month, incomeCents, noIncome, pillars]
      properties:
        month: { type: string, example: '2026-07' }
        incomeCents: { type: integer, format: int64 }
        noIncome:
          type: boolean
          description: True when month income is zero — show absolute values instead of percents (R10).
        pillars:
          type: array
          items:
            type: object
            required: [pillar, targetPercent, spentCents]
            properties:
              pillar: { $ref: '#/components/schemas/Pillar' }
              targetPercent:
                type: integer
                description: >
                  The target in force during this month, not today's — editing the targets does not
                  rewrite how a closed month was judged.
              spentCents:
                type: integer
                format: int64
                description: >
                  Expenses by competency + contributions of the pillar (R2, R9), counting only
                  SETTLED entries. Pending rows — which recurrences produce by the dozen — belong
                  to the projected balance (R5), not to what the month actually consumed.
              actualPercent:
                type: number
                format: double
                nullable: true
                description: spent ÷ income × 100; null when noIncome.

security:
  - cookieAuth: []
