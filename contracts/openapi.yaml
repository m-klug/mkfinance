openapi: 3.0.3
info:
  title: MK Finance API
  description: >
    Personal finance API (MVP). Money values are always integer cents (int64).
    Business dates are ISO local dates in America/Sao_Paulo. Errors return a
    machine-readable code translated by the client. See PLANEJAMENTO.md for
    the business rules referenced here (R1..R10).
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: auth
  - name: workspaces
  - name: accounts
  - name: categories
  - name: pillars
  - name: transactions
  - name: transfers
  - name: cards
  - name: statements
  - name: dashboard
  - name: recurrences
  - name: calendar
  - name: tags
  - name: reimbursements
  - name: vaults
  - name: export
  - name: marketRates
  - name: fixedIncome
  - name: investments

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created; personal workspace seeded; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Session invalidated. }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user with workspace memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /market-rates:
    get:
      tags: [marketRates]
      operationId: listMarketRates
      description: >
        Current CDI, Selic and IPCA from the Banco Central (SGS), the values the fixed-income
        simulator pre-fills. Public market data, so not tied to a workspace. Served from the database;
        a value older than a few hours is refreshed first, and if the Banco Central cannot be reached
        the last stored value is returned as is (see fetchedAt). A rate never stored and not
        reachable is left out of the list.
      responses:
        '200':
          description: One entry per available rate, in the order CDI, SELIC, IPCA.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketRate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /fixed-income/simulations:
    post:
      tags: [fixedIncome]
      operationId: simulateFixedIncome
      description: >
        Projects one fixed-income investment to its redemption, or two to compare. Persists nothing and
        is not tied to a workspace. The initial amount is applied on startDate and the monthly
        contribution on the same day of each following month up to the month before the end; the
        redemption is `months` months after the start. Each contribution accrues over business days
        (252 a year) and is taxed by its own age (income tax regressive 22.5/20/17.5/15%; IOF below
        30 days; LCI and LCA exempt; B3 custody on Tesouro). CDI, Selic and the IPCA projection are held
        constant over the term; any left out is filled from GET /market-rates and echoed in
        `assumptions`. With two simulations the winner is the one with the higher net annual equivalent.
        Instruments and indexers — CDB, LC, LCI, LCA: PREFIXED, CDI_PERCENT, IPCA_PLUS;
        TESOURO_SELIC: SELIC_PERCENT; TESOURO_PREFIXADO: PREFIXED; TESOURO_IPCA: IPCA_PLUS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedIncomeSimulationRequest' }
      responses:
        '200':
          description: One result per simulation, in request order; comparison only when there are two.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixedIncomeSimulationResponse' }
        '400':
          description: >
            VALIDATION_ERROR, or SIMULATION_INDEXER_NOT_AVAILABLE / SIMULATION_NOTHING_APPLIED with
            params.index naming the offending simulation (0 or 1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: >
            MARKET_RATE_UNAVAILABLE (params.rate): an assumption was left out, nothing is stored and the
            Banco Central cannot be reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces the current user is a member of.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceRequest' }
      responses:
        '201':
          description: Workspace created with defaults seeded; caller becomes OWNER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  /workspaces/{workspaceId}/invites:
    post:
      tags: [workspaces]
      operationId: createInvite
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '201':
          description: Single-use invite token (share as link).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }

  /invites/{token}/accept:
    post:
      tags: [workspaces]
      operationId: acceptInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current user joined the workspace as MEMBER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '410': { $ref: '#/components/responses/Gone' }

  /workspaces/{workspaceId}/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts with their current and projected balances (R5).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [accounts]
      operationId: createAccount
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /workspaces/{workspaceId}/accounts/{accountId}:
    patch:
      tags: [accounts]
      operationId: updateAccount
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      description: Fails with ACCOUNT_HAS_TRANSACTIONS if any transaction references it (archive instead).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/accounts/{accountId}/archive:
    post:
      tags: [accounts]
      operationId: archiveAccount
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      responses:
        '200':
          description: Archived (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /workspaces/{workspaceId}/categories:
    get:
      tags: [categories]
      operationId: listCategories
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
      responses:
        '200':
          description: Flat list; client builds the tree via parentId, grouped by pillar.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [categories]
      operationId: createCategory
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Created. EXPENSE requires pillar; INCOME forbids it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /workspaces/{workspaceId}/categories/{categoryId}:
    patch:
      tags: [categories]
      operationId: updateCategory
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/categoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      description: Fails with CATEGORY_IN_USE if referenced; archive semantics handled client-side by hiding.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/categoryId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/pillar-allocations:
    get:
      tags: [pillars]
      operationId: listPillarAllocations
      description: >
        Targets in force during the given month. Targets are versioned by competency: editing them
        applies from the current month onwards and never rewrites a closed month, so a past report
        keeps the targets it was judged against.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Target percent per pillar for that month; always the six pillars, summing 100.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PillarAllocation' }
    put:
      tags: [pillars]
      operationId: updatePillarAllocations
      description: >
        Replaces the targets from the current month onwards (effectiveFrom = first day of the
        current month in America/Sao_Paulo). Earlier competencies are left untouched. PUT rather
        than PATCH because the six targets are one indivisible set — they only mean anything if
        they add up to 100.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PillarAllocationsRequest' }
      responses:
        '200':
          description: The targets now in force.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PillarAllocation' }
        '400':
          description: PILLAR_TARGETS_MUST_SUM_100 when the six targets do not add up to 100.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TransactionType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransactionStatus' } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tagsFilter' }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: Paginated transactions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
    post:
      tags: [transactions]
      operationId: createTransaction
      description: INCOME or EXPENSE only — transfers/contributions go through /transfers.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

  /workspaces/{workspaceId}/transactions/{transactionId}:
    patch:
      tags: [transactions]
      operationId: updateTransaction
      description: >
        Edits an INCOME or EXPENSE entry. Transfer legs are not editable here — a transfer has no
        category and its type cannot change, so it has its own payload at
        PATCH /transfers/{transactionId}; sending a transfer leg's id to this endpoint answers
        TRANSACTION_TYPE_IMMUTABLE.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      description: >
        Deleting one leg of a transfer deletes its pair atomically. The debit created by a
        credit-card statement payment cannot be deleted here — it answers 409
        TRANSACTION_LOCKED_BY_PAYMENT, and the client should send the user to reverse the
        payment on the statement, which removes both.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/transactions/{transactionId}/settle:
    post:
      tags: [transactions]
      operationId: settleTransaction
      description: One-click settle of a PENDING transaction (R5).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '200':
          description: Now SETTLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/transactions/reimbursable-pending:
    get:
      tags: [reimbursements]
      operationId: listReimbursablePending
      description: >
        Expenses that still expect money back (reimbursableCents above what is linked), of any
        month, oldest first — what the "link to expenses" dialog offers. Each row carries
        pendingReimbursementCents.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200':
          description: Expenses with a pending reimbursement.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }

  /workspaces/{workspaceId}/transactions/{transactionId}/reimbursements:
    get:
      tags: [reimbursements]
      operationId: listReimbursements
      description: The links touching this transaction, whichever side (INCOME or EXPENSE) it is on.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      responses:
        '200':
          description: Links, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reimbursement' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reimbursements]
      operationId: createReimbursement
      description: >
        Links amountCents of the INCOME in the path to an EXPENSE. The income must be SETTLED, the
        sum of its links cannot exceed its amount (REIMBURSEMENT_OVER_INCOME) and the sum of the
        expense's links cannot exceed its reimbursableCents (REIMBURSEMENT_OVER_EXPENSE). Linking
        the same pair again adds to the existing link. Nothing changes in account balances; the
        expense's cost drops in the month of the expense and the income stops counting as income
        (ADR-0002).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: transactionId
          in: path
          required: true
          description: The INCOME that was received.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReimbursementRequest' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reimbursement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/reimbursements/{reimbursementId}:
    delete:
      tags: [reimbursements]
      operationId: deleteReimbursement
      description: Unlinks. The expense counts for what it cost again and the income counts as income again.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: reimbursementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Unlinked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/investments/summary:
    get:
      tags: [investments]
      operationId: getInvestmentSummary
      description: >
        Net worth as of today. The balance of an account only gains a title's yield when the title is
        paid, so it understates what is owned in the meantime; estimatedNetWorthCents adds the net
        yield the active positions have accrued. Investment and savings accounts are grouped as
        investments, every other non-archived account as accountsAndCash. Card bills still owed are
        reported beside the total and never subtracted. A paid position is not counted again (its yield
        is already in its account's balance).
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestmentSummary' }

  /workspaces/{workspaceId}/investments/unlinked-contributions:
    get:
      tags: [investments]
      operationId: listUnlinkedContributions
      description: >
        Purchases a position can still be born from: settled transfers into an investment or savings
        account that no position claims yet, newest first. Only the entering leg is listed.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200':
          description: Purchases without a position.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnlinkedContribution' }

  /workspaces/{workspaceId}/investments/positions:
    get:
      tags: [investments]
      operationId: listPositions
      description: >
        Fixed-income positions, soonest maturity first. Each active one carries what the app estimates
        for it today and at its maturity.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ACTIVE, SETTLED] }
      responses:
        '200':
          description: Positions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
    post:
      tags: [investments]
      operationId: createPosition
      description: >
        Creates a position with exactly one origin: contributionTransactionId (the entering leg of the
        purchase transfer, which supplies account, amount, date and vault), or accountId +
        principalCents + purchaseDate (a title bought before the app; it creates no transfer and
        changes no balance). Never moves money.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400':
          description: >
            VALIDATION_ERROR, POSITION_ORIGIN_INVALID, POSITION_CONTRIBUTION_INVALID,
            POSITION_ACCOUNT_INVALID, POSITION_VAULT_INVALID, POSITION_INDEXER_NOT_AVAILABLE or
            POSITION_DATES_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_ALREADY_EXISTS — the purchase already originated a position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/investments/positions/{positionId}:
    parameters:
      - { $ref: '#/components/parameters/workspaceId' }
      - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [investments]
      operationId: getPosition
      responses:
        '200':
          description: The position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [investments]
      operationId: updatePosition
      description: >
        Replaces the editable facts of an ACTIVE position, so an omitted vaultId clears it. A position
        born from a purchase transfer takes principal and purchase date from it and ignores
        principalCents/purchaseDate here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionUpdateRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400':
          description: VALIDATION_ERROR, POSITION_VAULT_INVALID, POSITION_INDEXER_NOT_AVAILABLE or POSITION_DATES_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_SETTLED — a settled position is not edited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [investments]
      operationId: deletePosition
      description: Removes the registration only; the purchase transfer is untouched. Not for a settled position.
      responses:
        '204': { description: Deleted. }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_SETTLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/investments/positions/{positionId}/settle:
    post:
      tags: [investments]
      operationId: settlePosition
      description: >
        Books the payment of a title. The real yield (receivedCents minus the principal) is booked as
        income on the position's account, entirely in the position's vault, or left in the account's
        unallocated slice when the position has no vault (even if the account has other vaults). The
        position remembers what was received next to what the app had estimated for that day. Records
        NO transfer: the credit that fell in checking keeps coming from the bank statement import or a
        manual entry, and can be linked with returnTransferTransactionId or later through
        PUT .../return-transfer. Book the yield before the transfer back: that transfer takes
        principal and yield out of the vault, which only holds them once the yield is booked.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionSettleRequest' }
      responses:
        '200':
          description: The settled position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400':
          description: >
            VALIDATION_ERROR, POSITION_DATES_INVALID (before the purchase or in the future),
            POSITION_RECEIVED_BELOW_PRINCIPAL (params.principalCents), POSITION_RETURN_TRANSFER_INVALID
            or POSITION_VAULT_INVALID (the position's vault was archived; edit the position first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_SETTLED — already paid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/investments/positions/{positionId}/unsettle:
    post:
      tags: [investments]
      operationId: unsettlePosition
      description: >
        Undoes a payment: deletes the booked yield (and its split with it), forgets what was received
        and the link to the transfer back, and returns the position to ACTIVE. This is how a wrong
        amount is fixed: undo, then settle again. While a position holds its yield, that income cannot be
        deleted or have its amount, date, account or category changed (TRANSACTION_HAS_POSITION).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The position, active again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_NOT_SETTLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/investments/positions/{positionId}/return-transfer:
    put:
      tags: [investments]
      operationId: linkPositionReturnTransfer
      description: >
        Links, or with a null id unlinks, the transfer that brought the paid money back to checking.
        Informational: changes no balance. Only the outgoing leg of a transfer out of the position's own
        account that no other position claims is accepted, and a linked transfer cannot be deleted.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionReturnTransferRequest' }
      responses:
        '200':
          description: The position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400':
          description: POSITION_RETURN_TRANSFER_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: POSITION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: POSITION_NOT_SETTLED — only a paid position takes a link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/transfers:
    post:
      tags: [transfers]
      operationId: createTransfer
      description: >
        Creates the mirrored pair (R4). When the destination account type is INVESTMENT or
        SAVINGS this is a contribution: contributionPillar applies (defaults to the account's
        defaultContributionPillar, R9) and the amount counts toward that pillar's allocation
        without being an expense.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: Both legs created; returns the outgoing leg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

  /workspaces/{workspaceId}/transfers/{transactionId}:
    patch:
      tags: [transfers]
      operationId: updateTransfer
      description: >
        Edits a transfer through either of its legs, updating the mirrored pair atomically (R4).
        Shared facts (amountCents, date, description, note, status) are written to both legs;
        accountId moves only the leg addressed by transactionId, since each side lives on its own
        account. Moving the incoming leg to a non-INVESTMENT/SAVINGS account drops the contribution
        pillar instead of failing (R9). Transfers have their own payload because they carry no
        category and their type cannot change, which TransactionRequest requires.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/transactionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferUpdateRequest' }
      responses:
        '200':
          description: Both legs updated; returns the leg addressed by transactionId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/cards:
    get:
      tags: [cards]
      operationId: listCards
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Cards with available limit (limit − unpaid statements).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
    post:
      tags: [cards]
      operationId: createCard
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /workspaces/{workspaceId}/cards/{cardId}:
    patch:
      tags: [cards]
      operationId: updateCard
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '200':
          description: Updated. Changing closingDay/dueDay only affects OPEN/future statements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /workspaces/{workspaceId}/cards/{cardId}/archive:
    post:
      tags: [cards]
      operationId: archiveCard
      description: >
        Archives the card (idempotent). An archived card is read-only history: it stays visible
        with includeArchived=true and its statements can still be read and paid, but no new
        purchase may be charged to it (CARD_ARCHIVED).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      responses:
        '200':
          description: Archived (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/cards/{cardId}/purchases:
    post:
      tags: [cards]
      operationId: createCardPurchase
      description: >
        Creates the purchase and all installments up-front, allocated to consecutive
        statements starting from the one determined by purchaseDate vs closingDay (R1, R3).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPurchaseRequest' }
      responses:
        '201':
          description: Purchase with generated installments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPurchase' }

  /workspaces/{workspaceId}/cards/{cardId}/purchases/batch:
    post:
      tags: [cards]
      operationId: createCardPurchasesBatch
      description: >
        Creates several outright purchases at once, all charged to `statementMonth` regardless of
        their purchase dates (used by statement imports, where the bank decides the bill).
        All-or-nothing: if any item is refused (e.g. STATEMENT_IMMUTABLE) none is created.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPurchaseBatchRequest' }
      responses:
        '201':
          description: The created purchases, in request order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CardPurchase' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/cards/{cardId}/statement-imports/preview:
    post:
      tags: [cards]
      operationId: previewStatementImport
      description: >
        Reads a card statement PDF (Banco Inter) and returns the lines it would import. Writes
        nothing and keeps nothing: neither the file nor the password is stored or logged. The
        password goes in the form body, never the URL.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password:
                  type: string
                  format: password
                  description: Opens the PDF; empty or omitted for an unprotected file.
      responses:
        '200':
          description: Preview of the statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementImportPreview' }
        '422':
          description: PDF_PASSWORD_INVALID, PDF_UNREADABLE or STATEMENT_PDF_UNSUPPORTED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/accounts/{accountId}/statement-imports/preview:
    post:
      tags: [accounts]
      operationId: previewBankStatementImport
      description: >
        Reads a bank statement file (OFX, Banco Inter checking account) and returns the movements it
        would import, each with a suggested mode (entry, transfer or card bill payment). Writes
        nothing and keeps nothing: the file is read in memory.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Preview of the statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementImportPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: OFX_UNREADABLE or OFX_UNSUPPORTED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/accounts/{accountId}/statement-imports/confirm:
    post:
      tags: [accounts]
      operationId: confirmBankStatementImport
      description: >
        Records the confirmed lines of a preview, all or nothing (up to 500). Each line is created
        by the rule that owns it: ENTRY like an ordinary transaction, TRANSFER like a transfer (R4,
        R9), STATEMENT_PAYMENT like a payment of the statement (R2). The bank's id of each line is
        kept on the account, so confirming the same file again is refused, never duplicated.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankStatementImportRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementImportResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: OFX_ITEM_INCOMPLETE, or the error of the rule that refused a line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/purchases/{purchaseId}:
    patch:
      tags: [cards]
      operationId: updateCardPurchase
      description: Affects only installments on non-PAID statements (R6); otherwise STATEMENT_IMMUTABLE.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/purchaseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPurchaseRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPurchase' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [cards]
      operationId: deleteCardPurchase
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/purchaseId' }
      responses:
        '204': { description: Deleted (only if no installment sits on a PAID statement). }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/cards/{cardId}/statements:
    get:
      tags: [statements]
      operationId: listStatements
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/cardId' }
        - name: from
          in: query
          description: Reference month (YYYY-MM), inclusive.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: to
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Statements in the window (created lazily as needed).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }

  /workspaces/{workspaceId}/statements/{statementId}:
    get:
      tags: [statements]
      operationId: getStatement
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
      responses:
        '200':
          description: Statement with line items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementDetail' }

  /workspaces/{workspaceId}/statements/{statementId}/payments:
    post:
      tags: [statements]
      operationId: payStatement
      description: >
        Full or partial payment. Debits the chosen account by creating an EXPENSE
        transaction with the system category "statement payment" (excluded from category
        reports, R2). Partial payment sets status PARTIAL; no revolving interest (MVP).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementPaymentRequest' }
      responses:
        '201':
          description: Payment registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/statements/{statementId}/payments/{paymentId}:
    delete:
      tags: [statements]
      operationId: reverseStatementPayment
      description: >
        Reverses one payment, deleting the EXPENSE transaction it created on the account
        along with it. Allowed on a PAID statement — R6 freezes a settled bill against
        charges, not against undoing the payment that settled it. The status is derived
        from the payments that remain, so it returns to PARTIAL or OPEN by itself and the
        statement total is unaffected. Deleting that EXPENSE directly through
        /transactions is refused with TRANSACTION_LOCKED_BY_PAYMENT; this is the way out.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/statementId' }
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Payment reversed. }
        '404':
          description: >
            STATEMENT_PAYMENT_NOT_FOUND when no such payment exists on this statement —
            including a payment id that belongs to a different statement — or
            STATEMENT_NOT_FOUND when the statement is not in this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Balances, month income/expense, category breakdown, open statements, previous-month comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /workspaces/{workspaceId}/dashboard/pillar-allocation:
    get:
      tags: [dashboard]
      operationId: getPillarAllocation
      description: 'Percent of month income consumed per pillar vs target (R2, R9, R10): expenses by competency + contributions, divided by month income.'
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Allocation report; noIncome=true means percents are null and absolute values should be shown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PillarAllocationReport' }

  /workspaces/{workspaceId}/recurrences:
    get:
      tags: [recurrences]
      operationId: listRecurrences
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - name: active
          in: query
          description: Omit to list every rule, including the ones closed by a THIS_AND_FUTURE edit.
          schema: { type: boolean }
      responses:
        '200':
          description: Recurrence rules of the workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recurrence' }
    post:
      tags: [recurrences]
      operationId: createRecurrence
      description: >
        Creates the rule only. Occurrences are materialized lazily as PENDING transactions when a
        month is read (extrato or calendar), the same way statements are created on demand — so a
        rule with no end date does not write rows into the year 2094.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurrenceRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurrence' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workspaces/{workspaceId}/recurrences/{recurrenceId}:
    patch:
      tags: [recurrences]
      operationId: updateRecurrence
      description: >
        Edits the series with calendar semantics, chosen by scope.
        THIS_ONE touches only the occurrence at occurrenceDate — the rule is left alone and the
        change lands on the transaction that occurrence materialized into; scheduling fields
        (frequency, dayOfMonth, dayOfWeek, monthOfYear, startDate, endDate) are ignored, since one
        occurrence has no schedule of its own.
        THIS_AND_FUTURE closes the current rule (endDate = the day before occurrenceDate) and
        creates a new one starting at occurrenceDate with the new values, which is what keeps the
        past intact; the response is the new rule.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/recurrenceId' }
        - { $ref: '#/components/parameters/recurrenceScope' }
        - { $ref: '#/components/parameters/occurrenceDate' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurrenceRequest' }
      responses:
        '200':
          description: The rule in force from occurrenceDate onwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurrence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: >
            RECURRENCE_NOT_FOUND, or RECURRENCE_OCCURRENCE_NOT_FOUND when occurrenceDate is not a
            date this rule actually falls on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [recurrences]
      operationId: deleteRecurrence
      description: >
        THIS_ONE marks the occurrence at occurrenceDate as SKIPPED and removes the PENDING
        transaction it had materialized; an occurrence already settled is kept, because deleting a
        rule must never erase money that was actually spent.
        THIS_AND_FUTURE closes the rule at the day before occurrenceDate and drops its
        still-PENDING occurrences from there on. Omitting occurrenceDate ends the series today,
        which is how the UI's plain "delete" behaves.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/recurrenceId' }
        - { $ref: '#/components/parameters/recurrenceScope' }
        - { $ref: '#/components/parameters/occurrenceDate' }
      responses:
        '204': { description: Occurrence skipped or series closed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      description: >
        Read-only month agenda: statement due dates and every still-pending transaction, including
        the ones a recurrence materialized (reading the month is what materializes them). There is
        no separate "recurrence occurrence" entry — a materialized occurrence *is* a pending
        transaction, and listing it twice would double the month. Entries carrying recurrenceId are
        the ones a series produced. Nothing is confirmed or paid from here; settling still goes
        through POST /transactions/{transactionId}/settle.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/month' }
      responses:
        '200':
          description: Entries of the month, ascending by date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarMonth' }

  /workspaces/{workspaceId}/tags:
    get:
      tags: [tags]
      operationId: listTags
      description: Every tag of the workspace, alphabetical — the source for the client-side autocomplete.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
    post:
      tags: [tags]
      operationId: createTag
      description: >
        Explicit creation, for managing tags outside a transaction. Typing a new tag while filling
        a transaction does not need this — TransactionRequest.tags creates what is missing.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tags/{tagId}:
    patch:
      tags: [tags]
      operationId: updateTag
      description: Renames the tag on every transaction carrying it. TAG_NAME_DUPLICATE if the name is taken.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/tagId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRequest' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tags]
      operationId: deleteTag
      description: >
        Deletes the tag and unlinks it from every transaction. The transactions themselves are
        never touched — a tag is a label, not the record.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/tagId' }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/accounts/{accountId}/vaults:
    get:
      tags: [vaults]
      operationId: listVaults
      description: >
        The account's whole composition in one request: every vault plus the unallocated slice.
        Vaults never hold money of their own — the account balance is still a single amount derived
        from transactions, and this splits it logically (R9, Caixinhas).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
        - name: includeArchived
          in: query
          description: Archived vaults are always empty, so they are hidden unless asked for.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Composition of the account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultComposition' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [vaults]
      operationId: createVault
      description: >
        Only INVESTMENT/SAVINGS accounts take vaults (R9) — anything else answers
        VALIDATION_ERROR. Creating the first non-archived vault on an account makes every later
        contribution into it require one; until then the account behaves exactly as before.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/vaults/{vaultId}:
    patch:
      tags: [vaults]
      operationId: updateVault
      description: >
        Changing contributionPillar applies from here on — contributions already booked keep the
        pillar they consumed, since a closed competency is never rewritten (same doctrine as the
        versioned pillar targets).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/vaultId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [vaults]
      operationId: deleteVault
      description: VAULT_HAS_ENTRIES when anything was ever booked to it; archive it instead.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/vaultId' }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/vaults/{vaultId}/archive:
    post:
      tags: [vaults]
      operationId: archiveVault
      description: >
        VAULT_NOT_EMPTY unless both balances are zero. An archived vault holding money would still
        have to show up in the composition and would still make contributions require a vault, with
        none selectable — so emptying it first is the way out, and archiving the last one returns
        the account to its no-vault behaviour.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/vaultId' }
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/vaults/{vaultId}/entries:
    get:
      tags: [vaults]
      operationId: listVaultEntries
      description: The vault's own ledger, most recent first — what went in and out, and why.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/vaultId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/vaults/reallocations:
    post:
      tags: [vaults]
      operationId: reallocateVault
      description: >
        Moves money between vaults of the same account. No account balance changes and no pillar is
        consumed — the money already consumed its pillar when it arrived. Either side may be null,
        meaning the unallocated slice: null → vault is how pre-existing account money gets split
        into vaults in the first place, and vault → null is how the last vault is emptied.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultReallocationRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultReallocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/vaults/reallocations/{reallocationId}:
    delete:
      tags: [vaults]
      operationId: deleteVaultReallocation
      description: Undoes both sides at once; a half-undone reallocation would not add up.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/reallocationId' }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/accounts/{accountId}/vault-yields:
    post:
      tags: [vaults]
      operationId: createVaultYield
      description: >
        Books the period's investment yield on the account and splits it across the vaults in
        proportion to their settled balances. It is an INCOME transaction under a system category:
        the money really did arrive, so the balance rises and the entry shows in the extrato — but
        it consumes no pillar (nothing was allocated, the market gave it) and stays out of the
        month's income, which is the denominator every pillar percentage is measured against (R10).
        Delete it through DELETE /transactions/{transactionId}; the split goes with it.
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/accountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultYieldRequest' }
      responses:
        '201':
          description: Booked, with the split that was applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultYield' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/export/transactions.csv:
    get:
      tags: [export]
      operationId: exportTransactionsCsv
      description: Same filters as listTransactions. UTF-8 with BOM, ';' separator (Excel pt-BR).
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV stream.
          content:
            text/csv:
              schema: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: MK_FINANCE_SESSION

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    transactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    cardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    purchaseId:
      name: purchaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    statementId:
      name: statementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    recurrenceId:
      name: recurrenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    tagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    vaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    reallocationId:
      name: reallocationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    month:
      name: month
      in: query
      description: Reference month YYYY-MM; defaults to current month in America/Sao_Paulo.
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    recurrenceScope:
      name: scope
      in: query
      description: Which part of the series the edit or deletion reaches.
      schema:
        allOf: [{ $ref: '#/components/schemas/RecurrenceScope' }]
        default: THIS_AND_FUTURE
    occurrenceDate:
      name: occurrenceDate
      in: query
      description: >
        The occurrence the scope pivots on. Required for THIS_ONE (VALIDATION_ERROR without it);
        for THIS_AND_FUTURE it defaults to the next occurrence on or after today, so the change
        takes effect going forward without the client having to compute the date.
      schema: { type: string, format: date }
    tagsFilter:
      name: tags
      in: query
      description: >
        Tag names; a transaction matches when it carries ANY of them (OR), narrowed further by the
        other filters. Compared case-insensitively, like everything else about tag names.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }

  responses:
    Unauthorized:
      description: Not authenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Malformed or inconsistent payload; see error code (VALIDATION_ERROR carries fieldErrors).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Business rule violation; see error code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: Resource expired or already used.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: >
        No such resource in this workspace. Another workspace's resource is indistinguishable from
        a nonexistent one — a 404, never a leak (R8).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >
            Machine-readable code translated by the client. Kept in sync with
            domain/exception/ErrorCode.java. Known codes include:
            auth — EMAIL_ALREADY_USED, INVALID_CREDENTIALS, UNAUTHENTICATED;
            workspace — NOT_A_MEMBER, WORKSPACE_NOT_FOUND, ACCESS_DENIED, INVITE_EXPIRED;
            accounts — ACCOUNT_NOT_FOUND, ACCOUNT_HAS_TRANSACTIONS, INVALID_CONTRIBUTION_PILLAR;
            categories — CATEGORY_NOT_FOUND, CATEGORY_IN_USE, CATEGORY_PILLAR_REQUIRED,
            CATEGORY_PILLAR_FORBIDDEN, SYSTEM_CATEGORY_READONLY;
            transactions and transfers — TRANSACTION_NOT_FOUND, TRANSACTION_ALREADY_SETTLED,
            TRANSACTION_TYPE_IMMUTABLE, CATEGORY_TYPE_MISMATCH, INSUFFICIENT_TRANSFER_ACCOUNTS,
            CONTRIBUTION_PILLAR_REQUIRED, TRANSACTION_LOCKED_BY_PAYMENT;
            reimbursements — REIMBURSEMENT_INVALID_LINK, REIMBURSEMENT_OVER_INCOME,
            REIMBURSEMENT_OVER_EXPENSE, REIMBURSEMENT_NOT_FOUND, REIMBURSABLE_INVALID,
            TRANSACTION_HAS_REIMBURSEMENTS;
            cards and statements — CARD_NOT_FOUND, CARD_ARCHIVED, PURCHASE_NOT_FOUND,
            STATEMENT_NOT_FOUND, STATEMENT_PAYMENT_NOT_FOUND, STATEMENT_IMMUTABLE,
            STATEMENT_ALREADY_PAID, PAYMENT_EXCEEDS_REMAINING, STATEMENT_EMPTY;
            statement PDF import — PDF_PASSWORD_INVALID, PDF_UNREADABLE, STATEMENT_PDF_UNSUPPORTED,
            IMPORT_LINK_INVALID;
            bank statement (OFX) import — OFX_UNREADABLE, OFX_UNSUPPORTED, OFX_ITEM_ALREADY_IMPORTED,
            OFX_ITEM_INCOMPLETE;
            pillar targets — PILLAR_TARGETS_MUST_SUM_100;
            recurrences — RECURRENCE_NOT_FOUND, RECURRENCE_OCCURRENCE_NOT_FOUND;
            tags — TAG_NAME_DUPLICATE, TAG_NOT_FOUND;
            vaults — VAULT_NOT_FOUND, VAULT_REQUIRED, VAULT_PILLAR_CONFLICT, VAULT_ACCOUNT_MISMATCH,
            VAULT_INSUFFICIENT_BALANCE, VAULT_NAME_DUPLICATE, VAULT_NOT_EMPTY, VAULT_HAS_ENTRIES,
            VAULT_ARCHIVED, VAULT_REALLOCATION_NOT_FOUND;
            fixed-income simulator — SIMULATION_INDEXER_NOT_AVAILABLE, SIMULATION_NOTHING_APPLIED,
            MARKET_RATE_UNAVAILABLE;
            fixed-income positions — POSITION_NOT_FOUND, POSITION_ORIGIN_INVALID,
            POSITION_CONTRIBUTION_INVALID, POSITION_ALREADY_EXISTS, POSITION_ACCOUNT_INVALID,
            POSITION_VAULT_INVALID, POSITION_INDEXER_NOT_AVAILABLE, POSITION_DATES_INVALID, POSITION_SETTLED,
            POSITION_NOT_SETTLED, POSITION_RECEIVED_BELOW_PRINCIPAL, POSITION_RETURN_TRANSFER_INVALID,
            TRANSACTION_HAS_POSITION;
            generic — VALIDATION_ERROR, DATA_INTEGRITY_VIOLATION, INTERNAL_ERROR.
        params:
          type: object
          additionalProperties: true
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }

    Pillar:
      type: string
      enum: [FIXED_COSTS, COMFORT, GOALS, PLEASURES, FINANCIAL_FREEDOM, KNOWLEDGE]
    ContributionPillar:
      type: string
      # The subset of Pillar an aporte can consume (R9): the pillars whose money is set aside
      # before it is spent. KNOWLEDGE joined GOALS and FINANCIAL_FREEDOM because study money is
      # saved up the same way — put aside now, spent on a course later.
      enum: [GOALS, FINANCIAL_FREEDOM, KNOWLEDGE]
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, INVESTMENT, OTHER]
    CategoryType:
      type: string
      enum: [INCOME, EXPENSE]
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER]
    TransactionStatus:
      type: string
      enum: [SETTLED, PENDING]
    TransferDirection:
      type: string
      enum: [OUT, IN]
    StatementStatus:
      type: string
      enum: [OPEN, CLOSED, PAID, PARTIAL]
    MemberRole:
      type: string
      enum: [OWNER, MEMBER]
    RecurrenceFrequency:
      type: string
      description: >
        MONTHLY is the case that matters (salary, rent, subscriptions); WEEKLY and YEARLY round it
        out. Deliberately not a cron expression — nothing in a personal budget needs one.
      enum: [MONTHLY, WEEKLY, YEARLY]
    RecurrenceScope:
      type: string
      enum: [THIS_ONE, THIS_AND_FUTURE]
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    CalendarEntryKind:
      type: string
      enum: [STATEMENT_DUE, PENDING_TRANSACTION]
    VaultEntrySource:
      type: string
      description: >
        What put the line in the vault's ledger. CONTRIBUTION and WITHDRAWAL mirror a transfer leg,
        YIELD is one share of a distributed yield, and REALLOCATION is money moved between vaults
        (or to and from the unallocated slice) without any transaction at all.
      enum: [CONTRIBUTION, WITHDRAWAL, YIELD, REALLOCATION]
    VaultGoalStatus:
      type: string
      enum: [IN_PROGRESS, REACHED, OVERDUE]

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    CurrentUser:
      type: object
      required: [id, name, email, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        locale: { type: string, example: pt-BR }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }

    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }

    WorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }

    Invite:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    Account:
      type: object
      required: [id, name, type, initialBalanceCents, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        initialBalanceCents: { type: integer, format: int64 }
        balanceCents:
          type: integer
          format: int64
          nullable: true
          description: initial + settled transactions (R5).
        projectedBalanceCents:
          type: integer
          format: int64
          nullable: true
          description: balance + settled and pending transactions (R5).
        defaultContributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
        color: { type: string, nullable: true, example: '#16A34A' }
        icon: { type: string, nullable: true }
        archived: { type: boolean }
        hasVaults:
          type: boolean
          description: >
            The account has at least one non-archived vault, so contributions into it must name one
            and defaultContributionPillar no longer decides — the destination vault does. Always
            sent by the server; optional here only so that clients written before the Caixinhas
            slice keep type-checking, and absent reads as false, which is the pre-vault behaviour.

    AccountRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/AccountType' }
        initialBalanceCents: { type: integer, format: int64, default: 0 }
        defaultContributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }

    Category:
      type: object
      required: [id, name, type, system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/CategoryType' }
        pillar:
          allOf: [{ $ref: '#/components/schemas/Pillar' }]
          nullable: true
          description: Required for EXPENSE, null for INCOME.
        parentId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        system:
          type: boolean
          description: System categories (e.g. statement payment) cannot be edited/deleted and are excluded from category reports (R2).

    CategoryRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 80 }
        type: { $ref: '#/components/schemas/CategoryType' }
        pillar:
          allOf: [{ $ref: '#/components/schemas/Pillar' }]
          nullable: true
        parentId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }

    PillarAllocation:
      type: object
      required: [pillar, targetPercent]
      properties:
        pillar: { $ref: '#/components/schemas/Pillar' }
        targetPercent: { type: integer, minimum: 0, maximum: 100 }
        effectiveFrom:
          type: string
          format: date
          description: >
            First day of the competency this target started applying from. Lets the UI say since
            when the number has been in force; absent on requests.

    PillarAllocationsRequest:
      type: object
      required: [allocations]
      description: >
        All six pillars at once. A subset is rejected — targets are only meaningful as a whole, and
        a missing pillar is indistinguishable from one the client forgot.
      properties:
        allocations:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [pillar, targetPercent]
            properties:
              pillar: { $ref: '#/components/schemas/Pillar' }
              targetPercent: { type: integer, minimum: 0, maximum: 100 }

    Transaction:
      type: object
      required: [id, accountId, type, amountCents, date, description, status]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true, description: Null for transfers. }
        type: { $ref: '#/components/schemas/TransactionType' }
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string }
        note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        transferPairId: { type: string, format: uuid, nullable: true }
        transferDirection:
          allOf: [{ $ref: '#/components/schemas/TransferDirection' }]
          nullable: true
          description: >
            OUT on the source leg, IN on the destination leg; null for INCOME/EXPENSE. amountCents
            is always positive, so this is the only way to tell money leaving an account from money
            arriving in it when rendering a transfer in the extrato.
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: Set on transfer legs into INVESTMENT/SAVINGS accounts (R9).
        vaultId:
          type: string
          format: uuid
          nullable: true
          description: >
            The vault this leg went into or came out of, when the account has vaults. The extrato
            badges the row with it; it is also what tells a contribution's pillar where it came
            from, since with vaults the pillar is the vault's, not the account's.
        recurrenceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The rule that materialized this row, when it came from a recurrence. The extrato uses
            it to badge the entry and to offer editing the whole series.
        tags:
          type: array
          description: >
            Always sent by the server, empty when the transaction has none. Optional here only so
            that clients written before Phase 2 keep type-checking.
          items: { $ref: '#/components/schemas/Tag' }
        reimbursableCents:
          type: integer
          format: int64
          nullable: true
          description: >
            EXPENSE only: how much the user expects to get back from other people. Null when none.
            The ceiling for the sum of the expense's reimbursement links.
        reimbursedCents:
          type: integer
          format: int64
          description: >
            Sum of the reimbursement links touching this row: received so far on an EXPENSE,
            applied to expenses on an INCOME. 0 when none. Optional only so older clients keep
            type-checking.
        pendingReimbursementCents:
          type: integer
          format: int64
          nullable: true
          description: EXPENSE with reimbursableCents only — what is still to receive. Null otherwise.
        effectiveAmountCents:
          type: integer
          format: int64
          nullable: true
          description: >
            EXPENSE only — amountCents minus reimbursedCents, what it really cost and what feeds
            the pillar and category reports. Null otherwise.

    Reimbursement:
      type: object
      required: [id, incomeTransactionId, expenseTransactionId, amountCents, createdAt]
      properties:
        id: { type: string, format: uuid }
        incomeTransactionId: { type: string, format: uuid }
        expenseTransactionId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }

    ReimbursementRequest:
      type: object
      required: [expenseTransactionId, amountCents]
      properties:
        expenseTransactionId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }

    TransactionRequest:
      type: object
      required: [accountId, categoryId, type, amountCents, date, description]
      properties:
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        type:
          type: string
          enum: [INCOME, EXPENSE]
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/TransactionStatus' }]
          default: SETTLED
        tags:
          type: array
          description: >
            Tag names, not ids: a tag is its name, and typing one that does not exist yet creates
            it. Duplicates within the list are collapsed case-insensitively. Sending the field
            replaces the whole set; omitting it leaves the current tags alone.
          items: { type: string, maxLength: 40 }
        reimbursableCents:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >
            EXPENSE only: how much the user expects to get back, between 1 and amountCents
            (REIMBURSABLE_INVALID otherwise). Omitting it leaves the current value alone on an
            edit; sending 0 clears it. An expense with reimbursement links cannot have it lowered
            below what is linked (TRANSACTION_HAS_REIMBURSEMENTS).

    TransactionPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }

    TransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amountCents, date, description]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: >
            Only when destination is INVESTMENT/SAVINGS. With no vault on the destination it
            defaults to the account's default pillar, exactly as before. With a vault it must
            either be omitted or match the vault's pillar — disagreeing answers
            VAULT_PILLAR_CONFLICT, because with vaults the pillar is the vault's to decide.
        fromVaultId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which vault the money leaves. Required (VAULT_REQUIRED) when the source account has
            vaults, refused (VAULT_NOT_FOUND) when it has none.
        toVaultId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which vault receives the contribution, and therefore which pillar it consumes (R9).
            Required (VAULT_REQUIRED) when the destination account has vaults, refused
            (VAULT_NOT_FOUND) when it has none.

    TransferUpdateRequest:
      type: object
      required: [amountCents, date, description]
      description: >
        Payload for PATCH /transfers/{transactionId}. It has no categoryId and no type on purpose:
        a transfer carries neither, which is exactly why TransactionRequest cannot express it.
      properties:
        accountId:
          type: string
          format: uuid
          nullable: true
          description: >
            Moves only the leg being edited to another account; omit to leave it where it is.
            Pointing it at the sibling's account answers INSUFFICIENT_TRANSFER_ACCOUNTS.
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/TransactionStatus' }]
          nullable: true
          description: Applied to both legs; omit to keep the current one. A half-settled transfer is never produced.
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          nullable: true
          description: >
            Re-targets the contribution (R9). Omit to keep whichever pillar the transfer already
            carries. Only meaningful when the destination account is INVESTMENT/SAVINGS; sending it
            for any other destination answers INVALID_CONTRIBUTION_PILLAR. Once the destination has
            a vault it becomes advisory: the vault decides, and a value that disagrees with it
            answers VAULT_PILLAR_CONFLICT.
        vaultId:
          type: string
          format: uuid
          nullable: true
          description: >
            Re-points the leg being edited at another vault, mirroring what accountId does for the
            account. Omit to carry the current vault forward — unless accountId moved the leg to a
            different account, in which case the old vault belongs to the old account and the rule
            runs afresh against the new one.

    Card:
      type: object
      required: [id, name, limitCents, closingDay, dueDay, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, nullable: true }
        limitCents: { type: integer, format: int64 }
        availableLimitCents:
          type: integer
          format: int64
          nullable: true
          description: limit − sum of unpaid statements.
        closingDay: { type: integer, minimum: 1, maximum: 28 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        defaultPaymentAccountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        archived: { type: boolean }

    CardRequest:
      type: object
      required: [name, limitCents, closingDay, dueDay]
      properties:
        name: { type: string, maxLength: 120 }
        brand: { type: string, nullable: true }
        limitCents: { type: integer, format: int64, minimum: 0 }
        closingDay: { type: integer, minimum: 1, maximum: 28 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        defaultPaymentAccountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }

    CardPurchaseRequest:
      type: object
      required: [categoryId, description, totalAmountCents, purchaseDate]
      properties:
        categoryId: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        totalAmountCents: { type: integer, format: int64, minimum: 1 }
        purchaseDate: { type: string, format: date }
        installmentCount: { type: integer, minimum: 1, maximum: 60, default: 1 }

    CardPurchaseBatchRequest:
      type: object
      required: [statementMonth, items]
      properties:
        statementMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Statement (reference month) every item is charged to.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [description, totalAmountCents, purchaseDate]
            properties:
              categoryId: { type: string, format: uuid, nullable: true, description: Required unless linkInstallmentId is set. }
              description: { type: string, maxLength: 255 }
              totalAmountCents: { type: integer, format: int64, minimum: 1 }
              purchaseDate: { type: string, format: date }
              externalId:
                type: string
                maxLength: 64
                nullable: true
                description: >-
                  Fingerprint of the statement line, as returned by the preview. A line whose fingerprint
                  is already stored on the card is skipped, so confirming a preview twice creates nothing.
              linkInstallmentId:
                type: string
                format: uuid
                nullable: true
                description: >-
                  Attach the line to this hand-typed installment (a preview candidate) instead of creating
                  a purchase. 409 IMPORT_LINK_INVALID when it is gone, on another card, or already linked.

    StatementImportPreview:
      type: object
      required: [statementMonth, dueDate, totalCents, lines, warnings]
      properties:
        statementMonth: { type: string, example: '2026-09', description: Statement the lines will be charged to, from the bill's due date. }
        dueDate: { type: string, format: date }
        totalCents: { type: integer, format: int64 }
        lines:
          type: array
          items:
            type: object
            required: [cardLast4, date, description, amountCents, kind, status, duplicate, externalId, candidates]
            properties:
              cardLast4: { type: string }
              date: { type: string, format: date }
              description: { type: string }
              amountCents: { type: integer, format: int64, description: Always positive; see kind. }
              kind:
                type: string
                enum: [EXPENSE, CREDIT, PAYMENT]
                description: Payments of the previous bill are never returned as lines.
              installmentNumber: { type: integer, nullable: true }
              installmentCount: { type: integer, nullable: true }
              status:
                type: string
                enum: [NEW, MATCH, AMBIGUOUS, ALREADY_IMPORTED]
                description: >-
                  NEW creates a purchase. MATCH: one hand-typed installment has the same amount and
                  installment and a date within 3 days (description is ignored). AMBIGUOUS: several do.
                  ALREADY_IMPORTED: this line was imported or linked before.
              duplicate: { type: boolean, description: Shorthand for status = ALREADY_IMPORTED. }
              externalId: { type: string, description: Fingerprint of the line; send it back when confirming. }
              candidates:
                type: array
                description: Hand-typed installments the line may be, closest date first. One for MATCH, several for AMBIGUOUS.
                items:
                  type: object
                  required: [installmentId, description, purchaseDate]
                  properties:
                    installmentId: { type: string, format: uuid }
                    description: { type: string }
                    purchaseDate: { type: string, format: date }
              suggestedCategoryId: { type: string, format: uuid, nullable: true }
        warnings:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [TOTAL_MISMATCH, CARD_TOTAL_MISMATCH, DUE_DATE_MISMATCH, PAYMENT_IGNORED]
              detail: { type: string, nullable: true, description: Card last four digits when the warning is about one card. }

    BankStatementImportPreview:
      type: object
      required: [accountBalanceCents, lines, warnings]
      properties:
        bankId: { type: string, nullable: true, example: '077', description: Bank code the file declares. }
        accountLast4: { type: string, nullable: true, description: Last digits of the account number in the file, to check it is the account picked. }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        accountBalanceCents: { type: integer, format: int64, description: What the account holds in the app now. }
        ledgerBalanceCents: { type: integer, format: int64, nullable: true, description: Balance the bank reports at ledgerBalanceDate. }
        ledgerBalanceDate: { type: string, format: date, nullable: true }
        lines:
          type: array
          items:
            type: object
            required: [externalId, date, description, type, amountCents, kind, mode, duplicate, statementCandidates, selectedByDefault]
            properties:
              externalId: { type: string, description: The bank's id for the movement (OFX FITID); unique within the account. }
              date: { type: string, format: date }
              description: { type: string }
              type:
                type: string
                enum: [INCOME, EXPENSE]
                description: INCOME when money enters the account, EXPENSE when it leaves.
              amountCents: { type: integer, format: int64, description: Always positive; see type. }
              kind:
                type: string
                enum: [NORMAL, CARD_BILL_PAYMENT, INVESTMENT_OUT, INVESTMENT_IN]
                description: What the bank's description says the movement is; only picks the default mode.
              mode:
                type: string
                enum: [ENTRY, TRANSFER, STATEMENT_PAYMENT]
              duplicate:
                type: string
                enum: [NONE, EXACT, POSSIBLE]
                description: EXACT when the account already holds this bank id; POSSIBLE when something typed by hand has the same day, amount and direction.
              suggestedCategoryId: { type: string, format: uuid, nullable: true }
              suggestedCounterpartAccountId: { type: string, format: uuid, nullable: true, description: The only investment account of the workspace, for investment movements. }
              suggestedStatementId: { type: string, format: uuid, nullable: true, description: The single open statement due around the date whose remaining amount equals the line. }
              statementCandidates:
                type: array
                description: Open statements due within five days of the date, to choose from when there is no single match.
                items:
                  type: object
                  required: [statementId, cardId, cardName, referenceMonth, dueDate, remainingCents]
                  properties:
                    statementId: { type: string, format: uuid }
                    cardId: { type: string, format: uuid }
                    cardName: { type: string }
                    referenceMonth: { type: string, example: '2026-09' }
                    dueDate: { type: string, format: date }
                    remainingCents: { type: integer, format: int64 }
              selectedByDefault: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [ZERO_AMOUNT_IGNORED, STATEMENT_PAYMENT_UNMATCHED]
              detail: { type: string, nullable: true, description: The bank id for ZERO_AMOUNT_IGNORED, a count for STATEMENT_PAYMENT_UNMATCHED. }

    BankStatementImportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [externalId, mode, type, amountCents, date, description]
            properties:
              externalId: { type: string, maxLength: 64 }
              mode:
                type: string
                enum: [ENTRY, TRANSFER, STATEMENT_PAYMENT]
              type:
                type: string
                enum: [INCOME, EXPENSE]
                description: INCOME when money entered the imported account. For TRANSFER it decides the direction.
              amountCents: { type: integer, format: int64, minimum: 1 }
              date: { type: string, format: date }
              description: { type: string, maxLength: 255 }
              categoryId: { type: string, format: uuid, nullable: true, description: Required for ENTRY. }
              counterpartAccountId: { type: string, format: uuid, nullable: true, description: Required for TRANSFER; the other account. }
              contributionPillar:
                nullable: true
                description: Only for a TRANSFER out into an investment account (R9); omitted takes the account's default.
                allOf:
                  - { $ref: '#/components/schemas/ContributionPillar' }
              statementId: { type: string, format: uuid, nullable: true, description: Required for STATEMENT_PAYMENT, which must be an EXPENSE. }

    BankStatementImportResult:
      type: object
      required: [entries, transfers, statementPayments]
      properties:
        entries: { type: integer }
        transfers: { type: integer }
        statementPayments: { type: integer }

    CardPurchase:
      type: object
      required: [id, cardId, categoryId, description, totalAmountCents, purchaseDate, installmentCount, installments]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        description: { type: string }
        totalAmountCents: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        installmentCount: { type: integer }
        installments:
          type: array
          items: { $ref: '#/components/schemas/Installment' }

    Installment:
      type: object
      required: [id, number, amountCents, statementId]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: 1-based. Cent remainder goes to the last installment (R1). }
        amountCents: { type: integer, format: int64 }
        statementId: { type: string, format: uuid }
        statementMonth: { type: string, example: '2026-08' }

    Statement:
      type: object
      required: [id, cardId, referenceMonth, closingDate, dueDate, status, totalCents, paidCents]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        referenceMonth: { type: string, example: '2026-07' }
        closingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/StatementStatus' }
        totalCents: { type: integer, format: int64 }
        paidCents: { type: integer, format: int64 }

    StatementDetail:
      allOf:
        - $ref: '#/components/schemas/Statement'
        - type: object
          required: [items, payments]
          properties:
            payments:
              description: >
                Payments made against this statement, oldest first. Listed individually
                rather than only summed into paidCents because each one is separately
                reversible — the client needs the id to say which.
              type: array
              items:
                type: object
                required: [id, accountId, amountCents, paymentDate]
                properties:
                  id: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  amountCents: { type: integer, format: int64 }
                  paymentDate: { type: string, format: date }
                  transactionId:
                    type: string
                    format: uuid
                    description: The EXPENSE row this payment created in the extrato (R2).
            items:
              type: array
              items:
                type: object
                required: [installmentId, purchaseId, description, categoryId, amountCents, purchaseDate, installmentNumber, installmentCount]
                properties:
                  installmentId: { type: string, format: uuid }
                  purchaseId: { type: string, format: uuid }
                  description: { type: string }
                  categoryId: { type: string, format: uuid }
                  amountCents: { type: integer, format: int64 }
                  purchaseDate: { type: string, format: date }
                  installmentNumber: { type: integer }
                  installmentCount: { type: integer }

    StatementPaymentRequest:
      type: object
      required: [accountId, amountCents, paymentDate]
      properties:
        accountId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        paymentDate: { type: string, format: date }

    Recurrence:
      type: object
      required: [id, type, accountId, categoryId, amountCents, description, frequency, startDate, active]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [INCOME, EXPENSE]
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        description: { type: string }
        note: { type: string, nullable: true }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: >
            MONTHLY and YEARLY. A day the month does not have falls on its last day — 31 becomes
            the 28th in February — instead of skipping the month.
        dayOfWeek:
          allOf: [{ $ref: '#/components/schemas/DayOfWeek' }]
          nullable: true
          description: WEEKLY only.
        monthOfYear:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
          description: YEARLY only, paired with dayOfMonth.
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          nullable: true
          description: Inclusive; null means open-ended. Set by a THIS_AND_FUTURE edit when it closes the rule.
        active:
          type: boolean
          description: >
            A deactivated rule stops producing new occurrences but keeps the ones already
            materialized — turning off the subscription does not undo the months you paid.

    RecurrenceRequest:
      type: object
      required: [type, accountId, categoryId, amountCents, description, frequency, startDate]
      description: >
        The scheduling fields required depend on frequency — dayOfMonth for MONTHLY, dayOfWeek for
        WEEKLY, dayOfMonth + monthOfYear for YEARLY. OpenAPI cannot express that conditional, so
        the server checks it and answers VALIDATION_ERROR with the offending field.
      properties:
        type:
          type: string
          enum: [INCOME, EXPENSE]
        accountId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1 }
        description: { type: string, maxLength: 255 }
        note: { type: string, nullable: true }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, nullable: true }
        dayOfWeek:
          allOf: [{ $ref: '#/components/schemas/DayOfWeek' }]
          nullable: true
        monthOfYear: { type: integer, minimum: 1, maximum: 12, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        active: { type: boolean, default: true }

    CalendarMonth:
      type: object
      required: [month, entries]
      properties:
        month: { type: string, example: '2026-08' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/CalendarEntry' }

    CalendarEntry:
      type: object
      required: [date, kind, description, amountCents]
      properties:
        date: { type: string, format: date }
        kind: { $ref: '#/components/schemas/CalendarEntryKind' }
        description:
          type: string
          description: The transaction's description, or the card's name for a statement due date.
        amountCents:
          type: integer
          format: int64
          description: >
            Always positive. What it means comes from kind and direction — the remaining balance of
            the statement for STATEMENT_DUE, the transaction amount otherwise.
        direction:
          allOf: [{ $ref: '#/components/schemas/TransferDirection' }]
          nullable: true
          description: IN for money expected, OUT for money owed; null when kind carries it already.
        transactionId: { type: string, format: uuid, nullable: true }
        statementId: { type: string, format: uuid, nullable: true }
        cardId: { type: string, format: uuid, nullable: true }
        accountId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        recurrenceId:
          type: string
          format: uuid
          nullable: true
          description: Set when this pending transaction came from a recurrence.

    FixedIncomeSimulationRequest:
      type: object
      required: [simulations]
      properties:
        simulations:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/FixedIncomeSimulationItem' }

    FixedIncomeSimulationItem:
      type: object
      required: [type, indexer, rate, months]
      properties:
        type: { type: string, enum: [CDB, LC, LCI, LCA, TESOURO_SELIC, TESOURO_PREFIXADO, TESOURO_IPCA] }
        indexer: { type: string, enum: [PREFIXED, CDI_PERCENT, SELIC_PERCENT, IPCA_PLUS] }
        rate:
          type: number
          minimum: 0
          maximum: 1000
          description: '% a.a. for PREFIXED and IPCA_PLUS; % of the CDI or Selic for the other two (110 = 110%).'
        initialCents: { type: integer, format: int64, minimum: 0, description: Omitted means none. }
        monthlyContributionCents: { type: integer, format: int64, minimum: 0, description: Omitted means none. }
        months: { type: integer, minimum: 1, maximum: 600 }
        startDate: { type: string, format: date, description: Omitted means today. }
        cdiAnnualPercent: { type: number, description: 'Premise, % a.a.; omitted is filled from the market.' }
        selicAnnualPercent: { type: number, description: 'Premise, % a.a.; omitted is filled from the market.' }
        ipcaAnnualPercent: { type: number, description: 'Projected IPCA, % a.a.; omitted is filled with the 12-month IPCA.' }

    FixedIncomeSimulationResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/FixedIncomeResult' }
        comparison: { $ref: '#/components/schemas/FixedIncomeComparison' }

    FixedIncomeResult:
      type: object
      required: [type, indexer, rate, startDate, endDate, months, assumptions, investedCents, grossCents,
                 grossYieldCents, iofCents, incomeTaxCents, custodyCents, netCents, netYieldCents,
                 netReturnPercent, netAnnualEquivalentPercent, series]
      properties:
        type: { type: string }
        indexer: { type: string }
        rate: { type: number }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        months: { type: integer }
        assumptions:
          type: object
          description: The premises the projection ran with; only those the indexer uses are present.
          properties:
            cdiAnnualPercent: { type: number }
            selicAnnualPercent: { type: number }
            ipcaAnnualPercent: { type: number }
        investedCents: { type: integer, format: int64 }
        grossCents: { type: integer, format: int64 }
        grossYieldCents: { type: integer, format: int64 }
        iofCents: { type: integer, format: int64 }
        incomeTaxCents: { type: integer, format: int64 }
        custodyCents: { type: integer, format: int64 }
        netCents: { type: integer, format: int64 }
        netYieldCents: { type: integer, format: int64 }
        netReturnPercent: { type: number, description: Net yield over the amount invested, in percent. }
        netAnnualEquivalentPercent:
          type: number
          description: The rate a.a. that makes each contribution reach the net amount; the figure to compare by.
        series:
          type: array
          description: One point per month from the start to the redemption, each as if redeemed that day.
          items:
            type: object
            required: [month, date, investedCents, grossCents, netCents]
            properties:
              month: { type: integer }
              date: { type: string, format: date }
              investedCents: { type: integer, format: int64 }
              grossCents: { type: integer, format: int64 }
              netCents: { type: integer, format: int64 }

    FixedIncomeComparison:
      type: object
      required: [netDifferenceCents, netAnnualEquivalentDifferencePercent]
      properties:
        betterIndex:
          type: integer
          enum: [0, 1]
          description: Position in the request of the simulation that yields more net; absent on a tie.
        netDifferenceCents: { type: integer, format: int64 }
        netAnnualEquivalentDifferencePercent: { type: number, description: In percentage points. }

    InvestmentSummary:
      type: object
      required: [accountsAndCashCents, investmentsCents, estimatedNetWorthCents, openStatementsCents,
                 assetClasses, accounts, unregisteredInvestmentCents, positionsExceedBalance]
      properties:
        accountsAndCashCents: { type: integer, format: int64, description: Balance of the non-archived accounts that are not investment or savings. }
        investmentsCents:
          type: integer
          format: int64
          description: Balance of the investment and savings accounts plus the accrued net yield of the active positions.
        estimatedNetWorthCents: { type: integer, format: int64, description: accountsAndCashCents + investmentsCents. }
        openStatementsCents: { type: integer, format: int64, description: Still owed on card bills; informational, never subtracted. }
        assetClasses:
          type: array
          description: One entry per class of asset; today only FIXED_INCOME, so variable income can be added without a redesign.
          items:
            type: object
            required: [code, appliedCents, estimatedValueCents, accruedYieldCents, positions, positionsWithoutEstimate]
            properties:
              code: { type: string, enum: [FIXED_INCOME] }
              appliedCents: { type: integer, format: int64, description: Principal of the active positions. }
              estimatedValueCents: { type: integer, format: int64, description: What they are worth today, net; a position the app cannot value counts at its principal. }
              accruedYieldCents: { type: integer, format: int64 }
              positions: { type: integer }
              positionsWithoutEstimate: { type: integer }
        accounts:
          type: array
          description: The investment and savings accounts, each with how much of its balance positions explain.
          items:
            type: object
            required: [accountId, name, balanceCents, positionsPrincipalCents, accruedYieldCents, unregisteredCents, positionsExceedBalance]
            properties:
              accountId: { type: string, format: uuid }
              name: { type: string }
              balanceCents: { type: integer, format: int64 }
              positionsPrincipalCents: { type: integer, format: int64 }
              accruedYieldCents: { type: integer, format: int64 }
              unregisteredCents: { type: integer, format: int64, description: Balance minus the principal of the positions, never below zero. }
              positionsExceedBalance:
                type: boolean
                description: >
                  The positions claim more than the account holds — usually a title bought before the app
                  whose amount was never added to the account's initial balance.
        unregisteredInvestmentCents: { type: integer, format: int64, description: The part of the investment balances no active position accounts for. }
        positionsExceedBalance: { type: boolean, description: True when any account has more principal in positions than it holds. }

    UnlinkedContribution:
      type: object
      required: [transactionId, accountId, accountName, amountCents, date, description]
      properties:
        transactionId: { type: string, format: uuid, description: 'The entering leg; pass it as contributionTransactionId.' }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        vaultId: { type: string, format: uuid, nullable: true }
        vaultName: { type: string, nullable: true }
        amountCents: { type: integer, format: int64 }
        date: { type: string, format: date }
        description: { type: string }

    PositionRequest:
      type: object
      required: [type, indexer, rate, maturityDate]
      properties:
        contributionTransactionId: { type: string, format: uuid, description: 'Origin 1: the purchase transfer leg.' }
        accountId: { type: string, format: uuid, description: 'Origin 2 (a title bought before the app): the investment or savings account.' }
        principalCents: { type: integer, format: int64, minimum: 1, description: 'Origin 2: the amount applied.' }
        purchaseDate: { type: string, format: date, description: 'Origin 2: when it was bought; not in the future.' }
        vaultId: { type: string, format: uuid, description: 'Where the yield goes on payment; optional.' }
        name: { type: string, maxLength: 80 }
        type: { type: string, enum: [CDB, LC, LCI, LCA, TESOURO_SELIC, TESOURO_PREFIXADO, TESOURO_IPCA] }
        indexer: { type: string, enum: [PREFIXED, CDI_PERCENT, SELIC_PERCENT, IPCA_PLUS], description: 'IPCA_PLUS is not accepted yet.' }
        rate:
          type: number
          minimum: 0
          maximum: 1000
          description: '% a.a. for PREFIXED; % of the CDI or Selic for the other indexers (110 = 110%).'
        maturityDate: { type: string, format: date, description: 'After the purchase date.' }

    PositionUpdateRequest:
      type: object
      required: [type, indexer, rate, maturityDate]
      properties:
        principalCents: { type: integer, format: int64, minimum: 1, description: 'Only for a position bought before the app.' }
        purchaseDate: { type: string, format: date, description: 'Only for a position bought before the app.' }
        vaultId: { type: string, format: uuid, description: 'Omitted clears it.' }
        name: { type: string, maxLength: 80 }
        type: { type: string, enum: [CDB, LC, LCI, LCA, TESOURO_SELIC, TESOURO_PREFIXADO, TESOURO_IPCA] }
        indexer: { type: string, enum: [PREFIXED, CDI_PERCENT, SELIC_PERCENT, IPCA_PLUS] }
        rate: { type: number, minimum: 0, maximum: 1000 }
        maturityDate: { type: string, format: date }

    Position:
      type: object
      required: [id, origin, accountId, accountName, type, indexer, rate, principalCents, purchaseDate,
                 maturityDate, status, awaitingPayment]
      properties:
        id: { type: string, format: uuid }
        origin:
          type: string
          enum: [CONTRIBUTION, MANUAL]
          description: CONTRIBUTION when born from a purchase transfer, MANUAL for a title bought before the app.
        contributionTransactionId: { type: string, format: uuid, nullable: true }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        vaultId: { type: string, format: uuid, nullable: true }
        vaultName: { type: string, nullable: true }
        name: { type: string, nullable: true }
        type: { type: string, enum: [CDB, LC, LCI, LCA, TESOURO_SELIC, TESOURO_PREFIXADO, TESOURO_IPCA] }
        indexer: { type: string, enum: [PREFIXED, CDI_PERCENT, SELIC_PERCENT, IPCA_PLUS] }
        rate: { type: number }
        principalCents: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, SETTLED] }
        awaitingPayment:
          type: boolean
          description: Active and past its maturity — due, with the credit not booked yet. Derived, never stored.
        settlement:
          type: object
          nullable: true
          description: Present once the title was paid.
          required: [settledDate, receivedCents]
          properties:
            settledDate: { type: string, format: date }
            receivedCents: { type: integer, format: int64 }
            estimatedNetCents: { type: integer, format: int64, nullable: true, description: What the app estimated on that day. }
            yieldCents: { type: integer, format: int64, nullable: true }
            returnTransferTransactionId: { type: string, format: uuid, nullable: true }
        estimate:
          type: object
          nullable: true
          description: >
            Absent for a settled position, and when it cannot be computed (a post-fixed title with no
            stored index and no current rate). Not money in the account: only information.
          required: [today, atMaturity]
          properties:
            today: { $ref: '#/components/schemas/PositionValuation' }
            atMaturity: { $ref: '#/components/schemas/PositionValuation' }

    PositionValuation:
      type: object
      required: [asOf, grossCents, grossYieldCents, iofCents, incomeTaxCents, custodyCents, netCents, netYieldCents]
      description: What the title is worth on asOf if redeemed that day, net of IOF, income tax and custody.
      properties:
        asOf: { type: string, format: date, description: Capped at the maturity. }
        grossCents: { type: integer, format: int64 }
        grossYieldCents: { type: integer, format: int64 }
        iofCents: { type: integer, format: int64 }
        incomeTaxCents: { type: integer, format: int64 }
        custodyCents: { type: integer, format: int64 }
        netCents: { type: integer, format: int64 }
        netYieldCents: { type: integer, format: int64 }
        lastIndexDate:
          type: string
          format: date
          nullable: true
          description: >
            Latest daily CDI/Selic actually used for the days already lived; earlier than yesterday when
            the Banco Central is behind. Absent for a fixed rate.

    PositionSettleRequest:
      type: object
      required: [settledDate, receivedCents]
      properties:
        settledDate: { type: string, format: date, description: 'The day the credit fell; not before the purchase, not in the future.' }
        receivedCents:
          type: integer
          format: int64
          minimum: 1
          description: 'The net amount received: principal plus the yield, already net of income tax and IOF. Not below the principal.'
        returnTransferTransactionId: { type: string, format: uuid, description: 'The outgoing leg of the transfer back, when already registered. Optional.' }

    PositionReturnTransferRequest:
      type: object
      properties:
        returnTransferTransactionId: { type: string, format: uuid, nullable: true, description: A null value unlinks. }

    MarketRate:
      type: object
      required: [code, ratePercent, referenceDate, fetchedAt]
      properties:
        code:
          type: string
          enum: [CDI, SELIC, IPCA]
          description: >
            CDI and SELIC are % a.a.; IPCA is the % accumulated over 12 months, offered only as a
            suggestion for the IPCA projection the user informs.
        ratePercent: { type: number, description: 'Percent, e.g. 13.65 means 13,65%.' }
        referenceDate: { type: string, format: date, description: 'The date the Banco Central dates the value.' }
        fetchedAt: { type: string, format: date-time, description: 'When this app last confirmed the value.' }

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          description: Unique per workspace, compared case-insensitively; stored as typed.

    Vault:
      type: object
      required: [id, accountId, name, contributionPillar, archived, balanceCents, projectedBalanceCents]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        name: { type: string }
        contributionPillar:
          allOf: [{ $ref: '#/components/schemas/ContributionPillar' }]
          description: >
            The pillar a contribution into this vault consumes (R9). This is the refinement the
            Caixinhas bring: the pillar belongs to where the money is going, not to the account
            holding it, so one brokerage account can feed GOALS, FINANCIAL_FREEDOM and KNOWLEDGE
            at once.
        targetAmountCents:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: The goal's amount. Null means the vault just holds money, with nothing to reach.
        targetDate:
          type: string
          format: date
          nullable: true
          description: Deadline. Only meaningful with targetAmountCents; a date alone has nothing to project.
        color: { type: string, nullable: true, example: '#16A34A' }
        archived: { type: boolean }
        balanceCents:
          type: integer
          format: int64
          description: Settled entries only (R5) — mirrors what balanceCents means on an account.
        projectedBalanceCents:
          type: integer
          format: int64
          description: >
            Settled and pending. Reallocations have no status and count in both: they are not money
            waiting to clear a bank, they are a reclassification that already happened.
        goal:
          allOf: [{ $ref: '#/components/schemas/VaultGoal' }]
          nullable: true
          description: Present exactly when targetAmountCents is set.

    VaultGoal:
      type: object
      required: [targetAmountCents, remainingCents, progressPercent, status]
      description: >
        Computed by the server so every client shows the same number. The projection is linear —
        it does not model returns; the fixed-income simulator is a later phase.
      properties:
        targetAmountCents: { type: integer, format: int64 }
        targetDate: { type: string, format: date, nullable: true }
        remainingCents:
          type: integer
          format: int64
          description: What is still missing, floored at zero.
        progressPercent:
          type: number
          format: double
          description: >
            current ÷ target × 100, deliberately not capped at 100 — the client decides how to
            celebrate an overshoot, same as with the pillar allocation's actualPercent.
        monthsRemaining:
          type: integer
          nullable: true
          description: >
            Counting the current competency, floored at zero. Null only when there is no deadline.
          minimum: 0
        monthlyNeededCents:
          type: integer
          format: int64
          nullable: true
          description: >
            remaining ÷ monthsRemaining, rounded up so that paying it every month actually gets
            there. Zero once the goal is reached, and the whole remainder when the deadline has
            passed — never null just because the date is behind us; null only without a deadline.
        status: { $ref: '#/components/schemas/VaultGoalStatus' }

    VaultRequest:
      type: object
      required: [name, contributionPillar]
      properties:
        name:
          type: string
          maxLength: 120
          description: Unique per account, compared case-insensitively.
        contributionPillar: { $ref: '#/components/schemas/ContributionPillar' }
        targetAmountCents:
          type: integer
          format: int64
          nullable: true
          minimum: 1
        targetDate:
          type: string
          format: date
          nullable: true
          description: Sending it without targetAmountCents answers VALIDATION_ERROR.
        color: { type: string, nullable: true }

    VaultComposition:
      type: object
      required: [accountId, balanceCents, projectedBalanceCents, allocatedCents, unallocatedCents, projectedUnallocatedCents, vaults]
      description: >
        How the account's single balance splits up. Σ vaults + unallocated = the account balance,
        at both the settled and the projected level, by construction.
      properties:
        accountId: { type: string, format: uuid }
        balanceCents: { type: integer, format: int64 }
        projectedBalanceCents: { type: integer, format: int64 }
        allocatedCents:
          type: integer
          format: int64
          description: Sum of the vaults' settled balances.
        unallocatedCents:
          type: integer
          format: int64
          description: >
            Account balance − allocated: money that has not picked a vault, and therefore has not
            picked a pillar. It can go negative — spending straight from the account, or paying a
            statement with it, does not know about vaults — and that is shown rather than blocked,
            the same way a negative account balance is shown.
        projectedUnallocatedCents: { type: integer, format: int64 }
        vaults:
          type: array
          items: { $ref: '#/components/schemas/Vault' }

    VaultEntry:
      type: object
      required: [id, vaultId, date, description, amountCents, source, status]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        date: { type: string, format: date }
        description: { type: string }
        amountCents:
          type: integer
          format: int64
          description: Signed — negative when money left the vault. Unlike everywhere else in this API.
        source: { $ref: '#/components/schemas/VaultEntrySource' }
        status:
          allOf: [{ $ref: '#/components/schemas/TransactionStatus' }]
          description: Taken from the transaction behind it; always SETTLED for a reallocation.
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: Null exactly for REALLOCATION, which moves no money in or out of the account.
        reallocationId:
          type: string
          format: uuid
          nullable: true
          description: Groups the two sides of a reallocation, or the single side when the other is unallocated.

    VaultReallocationRequest:
      type: object
      required: [amountCents, date]
      properties:
        fromVaultId:
          type: string
          format: uuid
          nullable: true
          description: Null means the unallocated slice — this is how existing account money enters a vault.
        toVaultId:
          type: string
          format: uuid
          nullable: true
          description: Null means the unallocated slice — this is how a vault is emptied before archiving.
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255, nullable: true }

    VaultReallocation:
      type: object
      required: [id, accountId, amountCents, date]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        fromVaultId: { type: string, format: uuid, nullable: true }
        toVaultId: { type: string, format: uuid, nullable: true }
        amountCents: { type: integer, format: int64 }
        date: { type: string, format: date }
        description: { type: string, nullable: true }

    VaultYieldRequest:
      type: object
      required: [amountCents, date]
      properties:
        amountCents: { type: integer, format: int64, minimum: 1 }
        date: { type: string, format: date }
        description: { type: string, maxLength: 255, nullable: true }

    VaultYield:
      type: object
      required: [transactionId, amountCents, date, shares]
      properties:
        transactionId:
          type: string
          format: uuid
          description: The INCOME transaction that was booked; delete it to undo the whole yield.
        amountCents: { type: integer, format: int64 }
        date: { type: string, format: date }
        shares:
          type: array
          description: >
            The split actually applied, proportional to each vault's settled balance. The shares
            always add up to amountCents exactly — the leftover cents go to the largest remainders.
            Empty when no vault held a positive balance, in which case the whole yield lands in the
            unallocated slice rather than being invented into some vault.
          items:
            type: object
            required: [vaultId, amountCents]
            properties:
              vaultId: { type: string, format: uuid }
              amountCents: { type: integer, format: int64 }

    DashboardSummary:
      type: object
      required: [month, totalBalanceCents, totalBalanceWithInvestmentsCents, incomeCents, expenseCents, accounts, expenseByCategory, openStatements]
      properties:
        month: { type: string, example: '2026-07' }
        totalBalanceCents: { type: integer, format: int64, description: Excludes INVESTMENT accounts. }
        totalBalanceWithInvestmentsCents: { type: integer, format: int64 }
        incomeCents: { type: integer, format: int64 }
        expenseCents: { type: integer, format: int64, description: By competency — card purchases count on purchase date (R2). }
        previousMonthIncomeCents: { type: integer, format: int64, nullable: true }
        previousMonthExpenseCents: { type: integer, format: int64, nullable: true }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        expenseByCategory:
          type: array
          items:
            type: object
            required: [categoryId, pillar, amountCents]
            properties:
              categoryId: { type: string, format: uuid }
              pillar: { $ref: '#/components/schemas/Pillar' }
              amountCents: { type: integer, format: int64 }
        openStatements:
          type: array
          items: { $ref: '#/components/schemas/Statement' }

    PillarAllocationReport:
      type: object
      required: [month, incomeCents, noIncome, pillars]
      properties:
        month: { type: string, example: '2026-07' }
        incomeCents: { type: integer, format: int64 }
        noIncome:
          type: boolean
          description: True when month income is zero — show absolute values instead of percents (R10).
        pillars:
          type: array
          items:
            type: object
            required: [pillar, targetPercent, spentCents]
            properties:
              pillar: { $ref: '#/components/schemas/Pillar' }
              targetPercent:
                type: integer
                description: >
                  The target in force during this month, not today's — editing the targets does not
                  rewrite how a closed month was judged.
              spentCents:
                type: integer
                format: int64
                description: >
                  Expenses by competency + contributions of the pillar (R2, R9), counting only
                  SETTLED entries. Pending rows — which recurrences produce by the dozen — belong
                  to the projected balance (R5), not to what the month actually consumed.
              actualPercent:
                type: number
                format: double
                nullable: true
                description: spent ÷ income × 100; null when noIncome.

security:
  - cookieAuth: []
