spring:
  application:
    name: portfolio
  datasource:
    url: jdbc:postgresql://localhost:5432/ir
    username: ir
    password: ir
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173

bcb:
  ptax:
    base-url: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
    connect-timeout: 3s
    read-timeout: 5s
    max-forward-days: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
